name: RAG golden eval

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/src/lib/airi/**"
      - ".github/workflows/rag-golden.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/src/lib/airi/**"
      - ".github/workflows/rag-golden.yml"

concurrency:
  group: rag-golden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rag-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run RAG golden eval
        run: pnpm --filter @icecore/web run test:rag-golden

      - name: Run RAG RAGAS-lite eval
        run: pnpm --filter @icecore/web run test:rag-ragas

      - name: Run RAG reliability stress eval
        run: pnpm --filter @icecore/web run test:rag-reliability

      - name: Run RAG launch-gate eval
        run: pnpm --filter @icecore/web run test:rag-launch-gate
