          src/components/scenarios/view/scenario-form-answer-labels.test.ts
          src/components/scenarios/view/scenario-guided-create.test.ts
          src/components/scenarios/view/scenario-request-error-utils.test.ts
          src/components/scenarios/view/scenarios-sidebar.test.tsx
