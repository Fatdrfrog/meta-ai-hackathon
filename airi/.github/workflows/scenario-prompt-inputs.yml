name: Scenario prompt inputs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/scenario-contracts/**"
      - "packages/airi-runtime/**"
      - "apps/web/src/components/scenarios/**"
      - "apps/web/src/lib/airi/**"
      - "apps/web/src/lib/business-locations/**"
      - "apps/web/src/app/api/workspaces/**/business-locations/**"
      - "apps/web/src/components/settings/business-locations/**"
      - "apps/web/src/features/panel/settings/**"
      - "apps/web/src/features/panel/shared/routing/**"
      - "apps/web/src/lib/spreadsheet/**"
      - "apps/web/src/lib/geo/**"
      - "apps/web/src/lib/workspace-feature-flags*"
      - "apps/web/src/components/campaigns/recipient-upload-parser*"
      - "apps/web/src/components/campaigns/csv-upload*"
      - "apps/web/src/components/integrations/**"
      - "apps/web/src/components/whatsapp-templates/**"
      - "apps/web/src/app/setup/**"
      - "apps/web/src/app/auth/complete-invite/**"
      - "apps/web/src/app/api/sources/whatsapp/**"
      - "apps/web/src/app/api/sources/workspace-selection.test.ts"
      - "apps/web/src/app/api/companies/**"
      - "apps/web/src/lib/limits/**"
      - "apps/web/messages/settings/**"
      - "apps/web/src/i18n/**"
      - "apps/web/src/lib/scenarios/**"
      - "apps/web/src/lib/meta-ads/**"
      - "apps/web/src/lib/instagram/**"
      - "apps/web/src/lib/whatsapp/**"
      - "apps/web/src/app/api/whatsapp/flows/**"
      - "apps/web/src/app/api/scenarios/**"
      - "apps/web/src/features/panel/scenarios/**"
      - "apps/web/src/proxy.ts"
      - "apps/web/src/lib/supabase/**"
      - "apps/web/src/lib/google/creative-asset-read-url*"
      - "apps/web/src/lib/mongo.ts"
      - "apps/web/src/models/scenario.ts"
      - "apps/web/src/models/business-location.ts"
      - "apps/web/src/lib/campaign/campaign-conversation-persistence*"
      - "apps/web/src/components/campaigns/**"
      - "apps/web/src/lib/campaign/bulk-campaign-send-gate*"
      - "apps/web/src/lib/campaign/bulk-campaign-contracts*"
      - "apps/web/src/app/api/campaigns/batch-plan/**"
      - "apps/web/src/lib/campaign/bulk-recipient-policy*"
      - "apps/web/src/lib/campaign/bulk-campaign-recipient-eligibility*"
      - "apps/web/src/lib/campaign/customer-contact-policy*"
      - "apps/web/src/lib/campaign/generated-bulk-preparation*"
      - "apps/web/src/lib/campaign/bulk-campaign-admission*"
      - "apps/web/src/lib/campaign/bulk-campaign-outcome*"
      - "apps/web/src/app/api/campaigns/bulk-send/**"
      - "apps/web/src/app/api/campaigns/*/retry/**"
      - "apps/web/src/app/api/workspaces/*/analytics/bulk/audience-preview/**"
      - "apps/web/messages/analytics/**"
      - "apps/web/src/models/conversation.ts"
      - "apps/web/src/types/models.ts"
      - "apps/web/messages/scenarios/**"
      - "apps/web/messages/*.json"
      - "apps/web/src/components/nav/**"
      - "apps/web/src/components/billing/**"
      - "apps/web/src/components/limits/**"
      - "apps/web/src/components/app-update-banner.tsx"
      - "apps/web/src/test-support/**"
      - "apps/web/package.json"
      - "apps/web/jest*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/scenario-prompt-inputs.yml"

permissions:
  contents: read

concurrency:
  group: scenario-prompt-inputs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prompt-input-regressions:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Scenario contracts tests
        run: pnpm --filter @icecore/scenario-contracts test
      - name: Scenario runtime regressions
        if: ${{ !cancelled() }}
        run: >-
          pnpm --filter @icecore/airi-runtime exec tsx --test
          src/scenario-prompt-input-turn.test.ts
          src/scenario-prompt-input-turn.safety.test.ts
          src/scenario-state.test.ts
          src/scenario-form-answer-turn.test.ts
          src/scenario-location-turn.test.ts
          src/temporal-scenario-timers/location-rescue.test.ts
          src/temporal-scenario-timers/automation.test.ts
          src/temporal-scenario-timers/branch-delay.test.ts
          src/temporal-scenario-timers/plan/index.test.ts
          src/whatsapp-webhook-runtime.test.ts
      - name: Shared package types
        if: ${{ !cancelled() }}
        run: pnpm --filter @icecore/scenario-contracts --filter @icecore/airi-runtime check-types
      - name: Editor, Flow, extraction and template regressions
        if: ${{ !cancelled() }}
        run: >-
          pnpm --filter @icecore/web exec jest --runInBand --runTestsByPath
          src/components/scenarios/builders/whatsapp/service-message/service-message-prompt-inputs.test.tsx
          src/components/scenarios/builders/whatsapp/service-message/service-message-builder.test.tsx
          src/components/scenarios/builders/whatsapp/field-editor.test.tsx
          src/components/scenarios/nodes/action-node/action-node.test.tsx
          src/components/scenarios/nodes/action-node/action-node-card.test.tsx
          src/components/scenarios/nodes/action-node/action-node-editor-sections.test.tsx
          src/components/scenarios/nodes/action-node/action-node-generative-ai-section.test.tsx
          src/components/scenarios/nodes/action-node/action-node-generative-state.test.ts
          src/components/scenarios/nodes/action-node/action-node-source-controls.test.tsx
          src/components/scenarios/nodes/action-node/action-node-whatsapp-service-message-section.test.tsx
          src/components/scenarios/nodes/action-node/action-node-whatsapp-template-section.test.tsx
          src/components/scenarios/nodes/action-node/use-form-answers-key-stamp.test.tsx
          src/components/scenarios/scenario-node-labels.test.ts
          src/components/scenarios/view/preview/utils.test.ts
          src/components/scenarios/view/graph/flow-helpers.test.ts
          src/components/scenarios/view/node-enrichment/action.test.ts
          src/components/scenarios/view/node-enrichment/scenario-node-graph-index.test.ts
          src/components/scenarios/view/node-enrichment/scenario-prompt-input-scope.test.ts
          src/components/scenarios/view/scenario-activation-impact.test.ts
