name: Tenant cost infrastructure

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKER_SERVICE_ACCOUNT: ${{ vars.GCP_WORKER_SERVICE_ACCOUNT }}
      GCP_AI_GATEWAY_SERVICE_ACCOUNT: ${{ vars.GCP_AI_GATEWAY_SERVICE_ACCOUNT }}
      GCP_LLM_ANALYTICS_LOCATION: ${{ vars.GCP_LLM_ANALYTICS_LOCATION || 'US' }}
      GCS_CREATIVE_ASSETS_BUCKET: ${{ vars.GCS_CREATIVE_ASSETS_BUCKET }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test infrastructure operator
        run: node --test .github/scripts/tenant-cost-infrastructure.test.mjs .github/scripts/sync-gcp-llm-product-analytics.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT || vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"
      - name: Inspect or prepare tenant cost infrastructure
        env:
          OPERATOR_PHASE: ${{ inputs.phase }}
        run: node .github/scripts/tenant-cost-infrastructure.mjs "$OPERATOR_PHASE"
