name: Web tests

# The full web Jest suite and the repository dependency-direction contract.
# Both used to run only by hand, so failures and import drift piled up on main.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/web/**"
      - "apps/temporal-worker/src/**"
      - "packages/**"
      - ".github/scripts/**"
      - ".github/workflows/web-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/temporal-worker/src/**"
      - "packages/**"
      - ".github/scripts/**"
      - ".github/workflows/web-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency direction contract
        run: node .github/scripts/verify-dependency-direction.mjs
      - name: Repository script tests
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/*.test.mjs

  web-jest:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      # Placeholder: suites mock Mongo; nothing may reach a real database.
      MONGODB_URI: mongodb://127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Web Jest shard ${{ matrix.shard }}/6
        run: >-
          pnpm --filter @icecore/web exec jest --ci --maxWorkers=2
          --shard=${{ matrix.shard }}/6
