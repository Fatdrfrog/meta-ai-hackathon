          VERTEX_MULTIMODAL_MODEL: ${{ vars.VERTEX_MULTIMODAL_MODEL }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: |
          set -euo pipefail

          OUT_DIR="${RUNNER_TEMP}/cloud-run-config"
          runtime_args=(
            --runtime worker
            --runtime gateway
            --runtime mediaApi
            --runtime otpWorker
            --runtime realtimeGateway
            --runtime realtimeDispatcher
          )

          if [[ "${GCP_OTP_API_ENABLED:-false}" == "true" ]]; then
            runtime_args+=(--runtime otpApi)
          fi

          node .github/scripts/prepare-cloud-run-runtime.mjs \
            --manifest .github/cloud-run/runtime-manifest.json \
            --out-dir "${OUT_DIR}" \
            "${runtime_args[@]}"

          worker_secrets_arg="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data.worker.setSecretsArg || "");' "${OUT_DIR}/metadata.json")"
          gateway_secrets_arg="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data.gateway.setSecretsArg || "");' "${OUT_DIR}/metadata.json")"
          media_api_secrets_arg="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data.mediaApi.setSecretsArg || "");' "${OUT_DIR}/metadata.json")"
          otp_worker_secrets_arg="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data.otpWorker.setSecretsArg || "");' "${OUT_DIR}/metadata.json")"
          otp_api_env_file="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data.otpApi?.envFile || "");' "${OUT_DIR}/metadata.json")"
          otp_api_secrets_arg="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data.otpApi?.setSecretsArg || "");' "${OUT_DIR}/metadata.json")"
          realtime_gateway_secrets_arg="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data.realtimeGateway.setSecretsArg || "");' "${OUT_DIR}/metadata.json")"
          realtime_dispatcher_secrets_arg="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data.realtimeDispatcher.setSecretsArg || "");' "${OUT_DIR}/metadata.json")"

          echo "out_dir=${OUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "worker_env_file=${OUT_DIR}/worker.env" >> "$GITHUB_OUTPUT"
          echo "gateway_env_file=${OUT_DIR}/gateway.env" >> "$GITHUB_OUTPUT"
          echo "media_api_env_file=${OUT_DIR}/mediaApi.env" >> "$GITHUB_OUTPUT"
          echo "otp_worker_env_file=${OUT_DIR}/otpWorker.env" >> "$GITHUB_OUTPUT"
          echo "otp_api_env_file=${otp_api_env_file}" >> "$GITHUB_OUTPUT"
          echo "realtime_gateway_env_file=${OUT_DIR}/realtimeGateway.env" >> "$GITHUB_OUTPUT"
          echo "realtime_dispatcher_env_file=${OUT_DIR}/realtimeDispatcher.env" >> "$GITHUB_OUTPUT"
          echo "metadata_file=${OUT_DIR}/metadata.json" >> "$GITHUB_OUTPUT"
          echo "worker_secrets_arg=${worker_secrets_arg}" >> "$GITHUB_OUTPUT"
          echo "gateway_secrets_arg=${gateway_secrets_arg}" >> "$GITHUB_OUTPUT"
          echo "media_api_secrets_arg=${media_api_secrets_arg}" >> "$GITHUB_OUTPUT"
          echo "otp_worker_secrets_arg=${otp_worker_secrets_arg}" >> "$GITHUB_OUTPUT"
          echo "otp_api_secrets_arg=${otp_api_secrets_arg}" >> "$GITHUB_OUTPUT"
          echo "realtime_gateway_secrets_arg=${realtime_gateway_secrets_arg}" >> "$GITHUB_OUTPUT"
          echo "realtime_dispatcher_secrets_arg=${realtime_dispatcher_secrets_arg}" >> "$GITHUB_OUTPUT"

      - name: Ensure creative assets GCS bucket
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID="${{ steps.deploy-meta.outputs.project_id }}"
          REGION="${{ steps.deploy-meta.outputs.region }}"
          BUCKET="${GCS_CREATIVE_ASSETS_BUCKET:-icecore-ai-creative-assets-prod}"
          SERVICE_ACCOUNT="${GCP_MEDIA_API_SERVICE_ACCOUNT:-${GCP_WORKER_SERVICE_ACCOUNT:-}}"
          APP_ORIGIN="${NEXT_PUBLIC_APP_URL:-https://airi.chat}"
          CORS_FILE="${RUNNER_TEMP}/creative-assets-gcs-cors.json"
          LIFECYCLE_FILE="${RUNNER_TEMP}/creative-assets-gcs-lifecycle.json"
          BOOTSTRAP_INFRA="${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_infra == true && 'true' || 'false' }}"

          if ! gcloud storage buckets describe "gs://${BUCKET}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            if [[ "${BOOTSTRAP_INFRA}" != "true" ]]; then
              echo "Creative assets bucket gs://${BUCKET} does not exist. Run this workflow manually with bootstrap_infra=true to create it."
              exit 1
            fi

            gcloud storage buckets create "gs://${BUCKET}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --uniform-bucket-level-access \
              --public-access-prevention
          fi

          export APP_ORIGIN CORS_FILE LIFECYCLE_FILE
          node .github/scripts/creative-assets-bucket-config.mjs generate

          if [[ "${BOOTSTRAP_INFRA}" == "true" ]]; then
            gcloud storage buckets update "gs://${BUCKET}" \
              --project="${PROJECT_ID}" \
              --uniform-bucket-level-access \
              --public-access-prevention

            gcloud storage buckets update "gs://${BUCKET}" \
              --project="${PROJECT_ID}" \
              --cors-file="${CORS_FILE}"

            gcloud storage buckets update "gs://${BUCKET}" \
              --project="${PROJECT_ID}" \
              --lifecycle-file="${LIFECYCLE_FILE}"
          else
            bucket_json="$(gcloud storage buckets describe "gs://${BUCKET}" --project="${PROJECT_ID}" --format=json)"
            export BUCKET_JSON="${bucket_json}"
            node .github/scripts/creative-assets-bucket-config.mjs validate
          fi

          if [[ -n "${SERVICE_ACCOUNT}" && "${BOOTSTRAP_INFRA}" == "true" ]]; then
            iam_json="$(gcloud storage buckets get-iam-policy "gs://${BUCKET}" --project="${PROJECT_ID}" --format=json)"
            set +e
            IAM_JSON="${iam_json}" SERVICE_ACCOUNT="${SERVICE_ACCOUNT}" node -e '
            const policy = JSON.parse(process.env.IAM_JSON || "{}");
            const member = `serviceAccount:${process.env.SERVICE_ACCOUNT}`;
            const hasBinding = Array.isArray(policy.bindings)
              && policy.bindings.some(binding => binding.role === "roles/storage.objectAdmin"
                && Array.isArray(binding.members)
                && binding.members.includes(member));
            if (!hasBinding) process.exit(2);
            '
            iam_status=$?
            set -e
            if [[ "${iam_status}" -eq 2 && "${BOOTSTRAP_INFRA}" == "true" ]]; then
              gcloud storage buckets add-iam-policy-binding "gs://${BUCKET}" \
                --project="${PROJECT_ID}" \
                --member="serviceAccount:${SERVICE_ACCOUNT}" \
                --role="roles/storage.objectAdmin" >/dev/null
            elif [[ "${iam_status}" -ne 0 ]]; then
              echo "Creative assets bucket is missing roles/storage.objectAdmin for serviceAccount:${SERVICE_ACCOUNT}. Run this workflow manually with bootstrap_infra=true or grant it out of band."
              exit 1
            fi

            service_account_iam_json="$(gcloud iam service-accounts get-iam-policy "${SERVICE_ACCOUNT}" --project="${PROJECT_ID}" --format=json)"
            set +e
            IAM_JSON="${service_account_iam_json}" SERVICE_ACCOUNT="${SERVICE_ACCOUNT}" node -e '
            const policy = JSON.parse(process.env.IAM_JSON || "{}");
            const member = `serviceAccount:${process.env.SERVICE_ACCOUNT}`;
            const hasBinding = Array.isArray(policy.bindings)
              && policy.bindings.some(binding => binding.role === "roles/iam.serviceAccountTokenCreator"
                && Array.isArray(binding.members)
                && binding.members.includes(member));
            if (!hasBinding) process.exit(2);
            '
            sign_blob_status=$?
            set -e
            if [[ "${sign_blob_status}" -eq 2 ]]; then
              gcloud iam service-accounts add-iam-policy-binding "${SERVICE_ACCOUNT}" \
                --project="${PROJECT_ID}" \
                --member="serviceAccount:${SERVICE_ACCOUNT}" \
                --role="roles/iam.serviceAccountTokenCreator" >/dev/null
            elif [[ "${sign_blob_status}" -ne 0 ]]; then
              echo "Creative assets media API service account ${SERVICE_ACCOUNT} could not verify roles/iam.serviceAccountTokenCreator self-binding."
              exit 1
            fi
          elif [[ -n "${SERVICE_ACCOUNT}" ]]; then
            echo "Skipping creative assets bucket IAM verification on normal deploy; bootstrap_infra owns bucket IAM setup."
          fi

      - name: Build and push worker image
        run: >
          gcloud builds submit
          --project=${{ steps.deploy-meta.outputs.project_id }}
          --config=cloudbuild.temporal-worker.yaml
          --substitutions=_IMAGE_URI=${{ steps.deploy-meta.outputs.image_uri }},_IMAGE_SOURCE_COMMIT=${{ github.sha }},_BUILD_CONTEXT_SHA256=${{ vars.REQUESTS_BUILD_CONTEXT_SHA256 || 'unknown' }},_REQUESTS_WRITER_PROTOCOL=sequence_v2,_MINIMUM_COMPATIBLE_BUILD=requests-sequence-v2-a
          .

      - name: Deploy Cloud Run worker pool
        shell: bash
        run: |
          set -euo pipefail

          WORKER_POOL_NAME="${{ steps.deploy-meta.outputs.worker_pool_name }}"
          PROJECT_ID="${{ steps.deploy-meta.outputs.project_id }}"
          REGION="${{ steps.deploy-meta.outputs.region }}"
          WORKER_INSTANCES="${GCP_WORKER_INSTANCES:-1}"
          WORKER_CPU="${GCP_WORKER_CPU:-2}"
          WORKER_MEMORY="${GCP_WORKER_MEMORY:-4Gi}"
          WORKER_NETWORK="${GCP_WORKER_VPC_NETWORK:-${GCP_REALTIME_VPC_NETWORK:-${{ steps.valkey.outputs.network }}}}"
          WORKER_SUBNET="${GCP_WORKER_VPC_SUBNET:-${GCP_REALTIME_VPC_SUBNET:-}}"

          if ! [[ "${WORKER_INSTANCES}" =~ ^[1-9][0-9]*$ ]]; then
            echo "GCP_WORKER_INSTANCES must be a positive integer so the Temporal worker can poll and register its build ID; got '${WORKER_INSTANCES}'."
            exit 1
          fi

          args=(
            beta run worker-pools deploy "${WORKER_POOL_NAME}"
            --project="${PROJECT_ID}"
            --region="${REGION}"
            --image="${{ steps.deploy-meta.outputs.image_uri }}"
            --revision-suffix=""
            --env-vars-file="${{ steps.runtime-config.outputs.worker_env_file }}"
            --instances="${WORKER_INSTANCES}"
            --cpu="${WORKER_CPU}"
            --memory="${WORKER_MEMORY}"
            --network="${WORKER_NETWORK}"
            --vpc-egress=private-ranges-only
          )

          if [[ -n "${WORKER_SUBNET}" ]]; then
            args+=(--subnet="${WORKER_SUBNET}")
          fi

          if [[ -n "${{ steps.runtime-config.outputs.worker_secrets_arg }}" ]]; then
            args+=(--set-secrets="${{ steps.runtime-config.outputs.worker_secrets_arg }}")
          fi

          if [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
            args+=(--service-account="${GCP_WORKER_SERVICE_ACCOUNT}")
          fi

          gcloud "${args[@]}"

          # A worker-pool revision can be ready while instances still point at an
          # older revision, especially after a prior --no-promote deploy.
          gcloud beta run worker-pools update-instance-split "${WORKER_POOL_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --to-latest

      - name: Wait for Cloud Run worker pool rollout
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID="${{ steps.deploy-meta.outputs.project_id }}"
          REGION="${{ steps.deploy-meta.outputs.region }}"
          WORKER_POOL_NAME="${{ steps.deploy-meta.outputs.worker_pool_name }}"

          # gcloud returns when the deploy API call succeeds; instances and revisions can
          # still be rolling out. Temporal only learns the build ID after workers connect.
          echo "Waiting for worker pool '${WORKER_POOL_NAME}' to finish reconciling..."
          for attempt in $(seq 1 72); do
            json="$(gcloud beta run worker-pools describe "${WORKER_POOL_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format=json)"

            # gcloud beta can surface either the v2 WorkerPool schema (top-level
            # reconciling / terminalCondition / latestReadyRevision) or the older
            # v1-style schema where readiness lives under status.conditions.
            generation="$(echo "${json}" | jq -r '.generation // .metadata.generation // empty')"
            observed_generation="$(echo "${json}" | jq -r '.observedGeneration // .observed_generation // .status.observedGeneration // .status.observed_generation // empty')"
            reconciling="$(echo "${json}" | jq -r '.reconciling // empty')"
            terminal_state="$(echo "${json}" | jq -r '.terminalCondition.state // .terminal_condition.state // empty')"
            ready_status="$(echo "${json}" | jq -r '((.status.conditions // .conditions // []) | map(select(.type == "Ready")) | .[0].status) // empty')"
            latest_ready="$(echo "${json}" | jq -r '.latestReadyRevision // .latest_ready_revision // .status.latestReadyRevisionName // .status.latest_ready_revision_name // empty')"
            latest_created="$(echo "${json}" | jq -r '.latestCreatedRevision // .latest_created_revision // .status.latestCreatedRevisionName // .status.latest_created_revision_name // empty')"

            if [[ "${terminal_state}" == "CONDITION_FAILED" ]] || [[ "${ready_status}" == "False" ]]; then
              echo "Worker pool rollout failed:"
              echo "${json}" | jq '(.terminalCondition // .terminal_condition // ((.status.conditions // .conditions // []) | map(select(.type == "Ready")) | .[0]))' || true
              exit 1
            fi

            if [[ -n "${terminal_state}" ]]; then
              if [[ "${reconciling}" == "false" ]] && [[ "${terminal_state}" == "CONDITION_SUCCEEDED" ]] && \
                 [[ -n "${latest_ready}" ]] && [[ "${latest_ready}" == "${latest_created}" ]]; then
                echo "Worker pool ready (revision ${latest_ready})."
                exit 0
              fi
            elif [[ -n "${ready_status}" ]]; then
              if [[ "${ready_status}" == "True" ]] && [[ -n "${latest_ready}" ]] && \
                 [[ -n "${latest_created}" ]] && [[ "${latest_ready}" == "${latest_created}" ]] && \
                 [[ -n "${generation}" ]] && [[ "${generation}" == "${observed_generation}" ]]; then
                echo "Worker pool ready (revision ${latest_ready})."
                exit 0
              fi
            fi

            if [[ "${attempt}" -eq 72 ]]; then
              echo "Worker pool did not become ready within $((attempt * 10))s. Last describe:"
              echo "${json}" | jq '.' || echo "${json}"
              exit 1
            fi

            sleep 10
          done

      # Promote right after the pool rollout. The rollout has just stopped the
      # previous build's instances, and AUTO_UPGRADE tasks keep routing to that
      # build until this runs, so any step placed before it stalls Temporal
      # work (it stalled ~1.5 min on every deploy while the gateway, dispatcher
      # and env-sync steps ran first). The startup probe step must follow it.
      - name: Mark build current in Temporal
        shell: bash
        run: |
          set -euo pipefail

          ADDRESS="${TEMPORAL_CLOUD_ADDRESS:?Set repo variable TEMPORAL_CLOUD_ADDRESS}"
          NAMESPACE="${TEMPORAL_CLOUD_NAMESPACE:?Set repo variable TEMPORAL_CLOUD_NAMESPACE}"
          API_KEY="${TEMPORAL_CLOUD_API_KEY:?Set repo secret TEMPORAL_CLOUD_API_KEY}"
          DEPLOYMENT_NAME="${{ steps.deploy-meta.outputs.temporal_deployment_name }}"
          BUILD_ID="${{ steps.deploy-meta.outputs.build_id }}"
          PROJECT_ID="${{ steps.deploy-meta.outputs.project_id }}"
          REGION="${{ steps.deploy-meta.outputs.region }}"
          WORKER_POOL_NAME="${{ steps.deploy-meta.outputs.worker_pool_name }}"
          LIFECYCLE_LOG_FILTER="jsonPayload.event=\"airi.worker.lifecycle\" AND jsonPayload.buildId=\"${BUILD_ID}\""

          temporal_args=(
            --address "${ADDRESS}"
            --namespace "${NAMESPACE}"
            --api-key "${API_KEY}"
          )

          dump_diagnostics() {
            echo "Temporal deployment snapshot:"
            temporal worker deployment describe \
              "${temporal_args[@]}" \
              --name "${DEPLOYMENT_NAME}" \
              --output json || true

            echo "Cloud Run worker pool snapshot:"
            gcloud beta run worker-pools describe "${WORKER_POOL_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format=json || true

            echo "Cloud Run worker lifecycle logs:"
            gcloud logging read \
              "${LIFECYCLE_LOG_FILTER}" \
              --project="${PROJECT_ID}" \
              --freshness=1h \
              --order=asc \
              --limit=50 \
              --format=json || true
          }

          # Build ID exists in Temporal only after at least one worker polls with that
          # deploymentName + buildId (not when Cloud Run accepts the deploy).
          DESCRIBE_MAX="${TEMPORAL_BUILD_ID_WAIT_ATTEMPTS:-48}"
          DESCRIBE_SLEEP="${TEMPORAL_BUILD_ID_WAIT_SECONDS:-15}"
          STARTUP_MAX="${TEMPORAL_WORKER_STARTUP_LOG_WAIT_ATTEMPTS:-24}"
          STARTUP_SLEEP="${TEMPORAL_WORKER_STARTUP_LOG_WAIT_SECONDS:-5}"
          SET_CURRENT_MAX="${TEMPORAL_SET_CURRENT_MAX_ATTEMPTS:-24}"
          SET_CURRENT_SLEEP="${TEMPORAL_SET_CURRENT_WAIT_SECONDS:-15}"

          require_positive_integer() {
            local name="$1"
            local value="$2"
            if ! [[ "${value}" =~ ^[1-9][0-9]*$ ]]; then
              echo "${name} must be a positive integer; got '${value}'."
              exit 1
            fi
          }

          require_nonnegative_integer() {
            local name="$1"
            local value="$2"
            if ! [[ "${value}" =~ ^[0-9]+$ ]]; then
              echo "${name} must be a nonnegative integer; got '${value}'."
              exit 1
            fi
          }

          require_positive_integer TEMPORAL_BUILD_ID_WAIT_ATTEMPTS "${DESCRIBE_MAX}"
          require_nonnegative_integer TEMPORAL_BUILD_ID_WAIT_SECONDS "${DESCRIBE_SLEEP}"
          require_positive_integer TEMPORAL_WORKER_STARTUP_LOG_WAIT_ATTEMPTS "${STARTUP_MAX}"
          require_nonnegative_integer TEMPORAL_WORKER_STARTUP_LOG_WAIT_SECONDS "${STARTUP_SLEEP}"
          require_positive_integer TEMPORAL_SET_CURRENT_MAX_ATTEMPTS "${SET_CURRENT_MAX}"
          require_nonnegative_integer TEMPORAL_SET_CURRENT_WAIT_SECONDS "${SET_CURRENT_SLEEP}"

          echo "Waiting for Temporal to register build ID '${BUILD_ID}' in deployment '${DEPLOYMENT_NAME}' (up to $((DESCRIBE_MAX * DESCRIBE_SLEEP))s)..."
          for attempt in $(seq 1 "${DESCRIBE_MAX}"); do
            if temporal worker deployment describe-version \
              "${temporal_args[@]}" \
              --deployment-name "${DEPLOYMENT_NAME}" \
              --build-id "${BUILD_ID}" \
              --output none; then
              echo "Build ID registered (attempt ${attempt}/${DESCRIBE_MAX})."
              break
            fi

            if [[ "${attempt}" -eq "${DESCRIBE_MAX}" ]]; then
              echo "Build ID '${BUILD_ID}' was not registered in Worker Deployment '${DEPLOYMENT_NAME}' after ${attempt} attempts."
              dump_diagnostics
              exit 1
            fi

            sleep "${DESCRIBE_SLEEP}"
          done

          STARTUP_LOG_FILTER="${LIFECYCLE_LOG_FILTER} AND jsonPayload.note=\"started\""
          STARTUP_FAILURE_LOG_FILTER="${LIFECYCLE_LOG_FILTER} AND (jsonPayload.note=\"auxiliary_step_failed\" OR jsonPayload.note=\"start_failed\")"
          echo "Waiting for Cloud Run worker build '${BUILD_ID}' to finish auxiliary startup (up to $((STARTUP_MAX * STARTUP_SLEEP))s)..."
          for attempt in $(seq 1 "${STARTUP_MAX}"); do
            if ! failed_startup_note="$(gcloud logging read "${STARTUP_FAILURE_LOG_FILTER}" \
              --project="${PROJECT_ID}" \
              --freshness=1h \
              --order=desc \
              --limit=1 \
              --format='value(jsonPayload.note)')"; then
              echo "Unable to query Cloud Logging for worker startup failures. Ensure the deployer has logging.logEntries.list permission."
              dump_diagnostics
              exit 1
            fi
            if [[ -n "${failed_startup_note}" ]]; then
              echo "Worker build '${BUILD_ID}' reported startup failure '${failed_startup_note}'."
              dump_diagnostics
              exit 1
            fi

            if ! started_build_id="$(gcloud logging read "${STARTUP_LOG_FILTER}" \
              --project="${PROJECT_ID}" \
              --freshness=1h \
              --limit=1 \
              --format='value(jsonPayload.buildId)')"; then
              echo "Unable to query Cloud Logging for worker startup. Ensure the deployer has logging.logEntries.list permission."
              dump_diagnostics
              exit 1
            fi
            if [[ "${started_build_id}" == "${BUILD_ID}" ]]; then
              echo "Worker startup completed (attempt ${attempt}/${STARTUP_MAX})."
              break
            fi

            if [[ "${attempt}" -eq "${STARTUP_MAX}" ]]; then
              echo "Worker build '${BUILD_ID}' registered with Temporal but did not finish auxiliary startup after ${attempt} attempts."
              dump_diagnostics
              exit 1
            fi

            sleep "${STARTUP_SLEEP}"
          done

          for attempt in $(seq 1 "${SET_CURRENT_MAX}"); do
            if temporal worker deployment set-current-version \
              "${temporal_args[@]}" \
              --deployment-name "${DEPLOYMENT_NAME}" \
              --build-id "${BUILD_ID}" \
              --yes; then
              exit 0
            fi

            if [[ "${attempt}" -eq "${SET_CURRENT_MAX}" ]]; then
              echo "Failed to mark Temporal deployment current after ${attempt} attempts."
              dump_diagnostics
              exit 1
            fi

            sleep "${SET_CURRENT_SLEEP}"
          done

      - name: Ensure worker startup probe
        shell: bash
        run: |
          set -euo pipefail

          # The pool keeps its previous instances until new ones pass their
          # startup check. With the probe, that waits until the worker has
          # started its consumers. gcloud has no probe flag for worker pools,
          # so the script sets it on the pool spec (one extra rollout of the
          # same build when the setting changes). It runs after the build is
          # current in Temporal: a failure here must never leave the running
          # instances on a build Temporal does not route to. Before rolling
          # back to an image built without the listener, turn
          # GCP_WORKER_STARTUP_PROBE_ENABLED off and deploy.
          node .github/scripts/ensure-worker-startup-probe.mjs \
            --project "${{ steps.deploy-meta.outputs.project_id }}" \
            --region "${{ steps.deploy-meta.outputs.region }}" \
            --worker-pool "${{ steps.deploy-meta.outputs.worker_pool_name }}" \
            --enabled "${GCP_WORKER_STARTUP_PROBE_ENABLED}" \
            --port "${GCP_WORKER_STARTUP_PROBE_PORT}"

      - name: Deploy Cloud Run realtime dispatcher worker pool
        shell: bash
        run: |
          set -euo pipefail

          DISPATCHER_POOL_NAME="${{ steps.deploy-meta.outputs.realtime_dispatcher_pool_name }}"
          PROJECT_ID="${{ steps.deploy-meta.outputs.project_id }}"
          REGION="${{ steps.deploy-meta.outputs.region }}"
          DISPATCHER_INSTANCES="$(node --input-type=module -e 'import { resolveRealtimeDispatcherInstanceCount } from "./.github/scripts/prepare-cloud-run-runtime.mjs"; console.log(resolveRealtimeDispatcherInstanceCount(process.env));')"
          NETWORK="${GCP_REALTIME_VPC_NETWORK:-${{ steps.valkey.outputs.network }}}"

          args=(
            beta run worker-pools deploy "${DISPATCHER_POOL_NAME}"
            --project="${PROJECT_ID}"
            --region="${REGION}"
            --image="${{ steps.deploy-meta.outputs.image_uri }}"
            --env-vars-file="${{ steps.runtime-config.outputs.realtime_dispatcher_env_file }}"
            --instances="${DISPATCHER_INSTANCES}"
            --network="${NETWORK}"
            --vpc-egress=private-ranges-only
          )

          if [[ -n "${GCP_REALTIME_VPC_SUBNET:-}" ]]; then
            args+=(--subnet="${GCP_REALTIME_VPC_SUBNET}")
          fi

          if [[ -n "${{ steps.runtime-config.outputs.realtime_dispatcher_secrets_arg }}" ]]; then
            args+=(--set-secrets="${{ steps.runtime-config.outputs.realtime_dispatcher_secrets_arg }}")
          fi

          if [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
            args+=(--service-account="${GCP_WORKER_SERVICE_ACCOUNT}")
          fi

          if [[ -n "${GCP_REALTIME_DISPATCHER_CPU:-}" ]]; then
            args+=(--cpu="${GCP_REALTIME_DISPATCHER_CPU}")
          fi

          if [[ -n "${GCP_REALTIME_DISPATCHER_MEMORY:-}" ]]; then
            args+=(--memory="${GCP_REALTIME_DISPATCHER_MEMORY}")
          fi

          gcloud "${args[@]}"

          gcloud beta run worker-pools update-instance-split "${DISPATCHER_POOL_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --to-latest

      - name: Wait for Cloud Run realtime dispatcher rollout
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID="${{ steps.deploy-meta.outputs.project_id }}"
          REGION="${{ steps.deploy-meta.outputs.region }}"
          DISPATCHER_POOL_NAME="${{ steps.deploy-meta.outputs.realtime_dispatcher_pool_name }}"

          echo "Waiting for realtime dispatcher '${DISPATCHER_POOL_NAME}' to finish reconciling..."
          for attempt in $(seq 1 72); do
            json="$(gcloud beta run worker-pools describe "${DISPATCHER_POOL_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format=json)"

            generation="$(echo "${json}" | jq -r '.generation // .metadata.generation // empty')"
            observed_generation="$(echo "${json}" | jq -r '.observedGeneration // .observed_generation // .status.observedGeneration // .status.observed_generation // empty')"
            reconciling="$(echo "${json}" | jq -r '.reconciling // empty')"
            terminal_state="$(echo "${json}" | jq -r '.terminalCondition.state // .terminal_condition.state // empty')"
            ready_status="$(echo "${json}" | jq -r '((.status.conditions // .conditions // []) | map(select(.type == "Ready")) | .[0].status) // empty')"
            latest_ready="$(echo "${json}" | jq -r '.latestReadyRevision // .latest_ready_revision // .status.latestReadyRevisionName // .status.latest_ready_revision_name // empty')"
            latest_created="$(echo "${json}" | jq -r '.latestCreatedRevision // .latest_created_revision // .status.latestCreatedRevisionName // .status.latest_created_revision_name // empty')"

            if [[ "${terminal_state}" == "CONDITION_FAILED" ]] || [[ "${ready_status}" == "False" ]]; then
              echo "Realtime dispatcher rollout failed:"
              echo "${json}" | jq '(.terminalCondition // .terminal_condition // ((.status.conditions // .conditions // []) | map(select(.type == "Ready")) | .[0]))' || true
              exit 1
            fi

            if [[ -n "${terminal_state}" ]]; then
              if [[ "${reconciling}" == "false" ]] && [[ "${terminal_state}" == "CONDITION_SUCCEEDED" ]] && \
                 [[ -n "${latest_ready}" ]] && [[ "${latest_ready}" == "${latest_created}" ]]; then
                echo "Realtime dispatcher ready (revision ${latest_ready})."
                exit 0
              fi
            elif [[ -n "${ready_status}" ]]; then
              if [[ "${ready_status}" == "True" ]] && [[ -n "${latest_ready}" ]] && \
                 [[ -n "${latest_created}" ]] && [[ "${latest_ready}" == "${latest_created}" ]] && \
                 [[ -n "${generation}" ]] && [[ "${generation}" == "${observed_generation}" ]]; then
                echo "Realtime dispatcher ready (revision ${latest_ready})."
                exit 0
              fi
            fi

            if [[ "${attempt}" -eq 72 ]]; then
              echo "Realtime dispatcher did not become ready within $((attempt * 10))s. Last describe:"
              echo "${json}" | jq '.' || echo "${json}"
              exit 1
            fi

            sleep 10
          done

      - name: Deploy Cloud Run OTP API
        if: ${{ vars.GCP_OTP_API_ENABLED == 'true' }}
        id: deploy-otp-api
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_NAME="${{ steps.deploy-meta.outputs.otp_api_service_name }}"
          NETWORK="${GCP_OTP_API_VPC_NETWORK:-${{ steps.valkey.outputs.network }}}"
          args=(
            run deploy "${SERVICE_NAME}"
            --project="${{ steps.deploy-meta.outputs.project_id }}"
            --region="${{ steps.deploy-meta.outputs.region }}"
            --image="${{ steps.deploy-meta.outputs.image_uri }}"
            --env-vars-file="${{ steps.runtime-config.outputs.otp_api_env_file }}"
            --no-invoker-iam-check
            --network="${NETWORK}"
            --vpc-egress=private-ranges-only
          )

          if [[ -n "${GCP_OTP_API_VPC_SUBNET:-}" ]]; then
            args+=(--subnet="${GCP_OTP_API_VPC_SUBNET}")
          fi

          if [[ -n "${{ steps.runtime-config.outputs.otp_api_secrets_arg }}" ]]; then
            args+=(--set-secrets="${{ steps.runtime-config.outputs.otp_api_secrets_arg }}")
          fi

          if [[ -n "${GCP_OTP_API_SERVICE_ACCOUNT:-}" ]]; then
            args+=(--service-account="${GCP_OTP_API_SERVICE_ACCOUNT}")
          elif [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
            args+=(--service-account="${GCP_WORKER_SERVICE_ACCOUNT}")
          fi

          if [[ -n "${GCP_OTP_API_MIN_INSTANCES:-}" ]]; then
            args+=(--min-instances="${GCP_OTP_API_MIN_INSTANCES}")
          fi

          if [[ -n "${GCP_OTP_API_MAX_INSTANCES:-}" ]]; then
            args+=(--max-instances="${GCP_OTP_API_MAX_INSTANCES}")
          fi

          if [[ -n "${GCP_OTP_API_CPU:-}" ]]; then
            args+=(--cpu="${GCP_OTP_API_CPU}")
          fi

          if [[ -n "${GCP_OTP_API_MEMORY:-}" ]]; then
            args+=(--memory="${GCP_OTP_API_MEMORY}")
          fi

          gcloud "${args[@]}"

          otp_api_url="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${{ steps.deploy-meta.outputs.project_id }}" \
            --region="${{ steps.deploy-meta.outputs.region }}" \
            --format='value(status.url)')"

          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "otp_api_url=${otp_api_url}" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run AI gateway
        id: deploy-gateway
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_NAME="${GCP_AI_GATEWAY_SERVICE_NAME:-airi-ai-gateway}"
          args=(
            run deploy "${SERVICE_NAME}"
            --project="${{ steps.deploy-meta.outputs.project_id }}"
            --region="${{ steps.deploy-meta.outputs.region }}"
            --image="${{ steps.deploy-meta.outputs.image_uri }}"
            --env-vars-file="${{ steps.runtime-config.outputs.gateway_env_file }}"
            --no-invoker-iam-check
          )

          if [[ -n "${{ steps.runtime-config.outputs.gateway_secrets_arg }}" ]]; then
            args+=(--set-secrets="${{ steps.runtime-config.outputs.gateway_secrets_arg }}")
          fi

          if [[ -n "${GCP_AI_GATEWAY_SERVICE_ACCOUNT:-}" ]]; then
            args+=(--service-account="${GCP_AI_GATEWAY_SERVICE_ACCOUNT}")
          elif [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
            args+=(--service-account="${GCP_WORKER_SERVICE_ACCOUNT}")
          fi

          if [[ -n "${GCP_AI_GATEWAY_MIN_INSTANCES:-}" ]]; then
            args+=(--min-instances="${GCP_AI_GATEWAY_MIN_INSTANCES}")
          fi

          if [[ -n "${GCP_AI_GATEWAY_MAX_INSTANCES:-}" ]]; then
            args+=(--max-instances="${GCP_AI_GATEWAY_MAX_INSTANCES}")
          fi

          if [[ -n "${GCP_AI_GATEWAY_CPU:-}" ]]; then
            args+=(--cpu="${GCP_AI_GATEWAY_CPU}")
          fi

          if [[ -n "${GCP_AI_GATEWAY_MEMORY:-}" ]]; then
            args+=(--memory="${GCP_AI_GATEWAY_MEMORY}")
          fi

          gcloud "${args[@]}"

          gateway_url="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${{ steps.deploy-meta.outputs.project_id }}" \
            --region="${{ steps.deploy-meta.outputs.region }}" \
            --format='value(status.url)')"

          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "gateway_url=${gateway_url}" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run media API
        id: deploy-media-api
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_NAME="${{ steps.deploy-meta.outputs.media_api_service_name }}"
          args=(
            run deploy "${SERVICE_NAME}"
            --project="${{ steps.deploy-meta.outputs.project_id }}"
            --region="${{ steps.deploy-meta.outputs.region }}"
            --image="${{ steps.deploy-meta.outputs.image_uri }}"
            --env-vars-file="${{ steps.runtime-config.outputs.media_api_env_file }}"
            --no-invoker-iam-check
          )

          if [[ -n "${{ steps.runtime-config.outputs.media_api_secrets_arg }}" ]]; then
            args+=(--set-secrets="${{ steps.runtime-config.outputs.media_api_secrets_arg }}")
          fi

          if [[ -n "${GCP_MEDIA_API_SERVICE_ACCOUNT:-}" ]]; then
            args+=(--service-account="${GCP_MEDIA_API_SERVICE_ACCOUNT}")
          elif [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
            args+=(--service-account="${GCP_WORKER_SERVICE_ACCOUNT}")
          fi

          if [[ -n "${GCP_MEDIA_API_MIN_INSTANCES:-}" ]]; then
            args+=(--min-instances="${GCP_MEDIA_API_MIN_INSTANCES}")
          fi

          if [[ -n "${GCP_MEDIA_API_MAX_INSTANCES:-}" ]]; then
            args+=(--max-instances="${GCP_MEDIA_API_MAX_INSTANCES}")
          fi

          if [[ -n "${GCP_MEDIA_API_CPU:-}" ]]; then
            args+=(--cpu="${GCP_MEDIA_API_CPU}")
          fi

          if [[ -n "${GCP_MEDIA_API_MEMORY:-}" ]]; then
            args+=(--memory="${GCP_MEDIA_API_MEMORY}")
          fi

          gcloud "${args[@]}"

          media_api_url="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${{ steps.deploy-meta.outputs.project_id }}" \
            --region="${{ steps.deploy-meta.outputs.region }}" \
            --format='value(status.url)')"

          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "media_api_url=${media_api_url}" >> "$GITHUB_OUTPUT"

      - name: Verify media API health
        shell: bash
        run: |
          set -euo pipefail

          media_api_url="${{ steps.deploy-media-api.outputs.media_api_url }}"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${media_api_url}/readyz" >/tmp/media-api-health.json; then
              cat /tmp/media-api-health.json
              exit 0
            fi
            if [[ "${attempt}" -eq 12 ]]; then
              echo "Media API did not pass /readyz health check after ${attempt} attempts."
              exit 1
            fi
            sleep 5
          done

      - name: Deploy Cloud Run realtime gateway
        id: deploy-realtime-gateway
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_NAME="${{ steps.deploy-meta.outputs.realtime_gateway_service_name }}"
          NETWORK="${GCP_REALTIME_VPC_NETWORK:-${{ steps.valkey.outputs.network }}}"
          args=(
            run deploy "${SERVICE_NAME}"
            --project="${{ steps.deploy-meta.outputs.project_id }}"
            --region="${{ steps.deploy-meta.outputs.region }}"
            --image="${{ steps.deploy-meta.outputs.image_uri }}"
            --env-vars-file="${{ steps.runtime-config.outputs.realtime_gateway_env_file }}"
            --no-invoker-iam-check
            --network="${NETWORK}"
            --vpc-egress=private-ranges-only
            --concurrency="${GCP_REALTIME_GATEWAY_CONCURRENCY:-1000}"
            --timeout="${GCP_REALTIME_GATEWAY_TIMEOUT:-3600s}"
            --no-cpu-throttling
          )

          if [[ -n "${GCP_REALTIME_VPC_SUBNET:-}" ]]; then
            args+=(--subnet="${GCP_REALTIME_VPC_SUBNET}")
          fi

          if [[ -n "${{ steps.runtime-config.outputs.realtime_gateway_secrets_arg }}" ]]; then
            args+=(--set-secrets="${{ steps.runtime-config.outputs.realtime_gateway_secrets_arg }}")
          fi

          if [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
            args+=(--service-account="${GCP_WORKER_SERVICE_ACCOUNT}")
          fi

          if [[ -n "${GCP_REALTIME_GATEWAY_MIN_INSTANCES:-}" ]]; then
            args+=(--min-instances="${GCP_REALTIME_GATEWAY_MIN_INSTANCES}")
          fi

          if [[ -n "${GCP_REALTIME_GATEWAY_MAX_INSTANCES:-}" ]]; then
            args+=(--max-instances="${GCP_REALTIME_GATEWAY_MAX_INSTANCES}")
          fi

          if [[ -n "${GCP_REALTIME_GATEWAY_CPU:-}" ]]; then
            args+=(--cpu="${GCP_REALTIME_GATEWAY_CPU}")
          fi

          if [[ -n "${GCP_REALTIME_GATEWAY_MEMORY:-}" ]]; then
            args+=(--memory="${GCP_REALTIME_GATEWAY_MEMORY}")
          fi

          gcloud "${args[@]}"

          realtime_gateway_url="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${{ steps.deploy-meta.outputs.project_id }}" \
            --region="${{ steps.deploy-meta.outputs.region }}" \
            --format='value(status.url)')"

          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "realtime_gateway_url=${realtime_gateway_url}" >> "$GITHUB_OUTPUT"

      - name: Verify realtime gateway health
        shell: bash
        run: |
          set -euo pipefail

          realtime_gateway_url="${{ steps.deploy-realtime-gateway.outputs.realtime_gateway_url }}"
          curl --fail --silent --show-error "${realtime_gateway_url}/readyz" >/tmp/realtime-gateway-health.json
          cat /tmp/realtime-gateway-health.json

      - name: Sync Vercel runtime env
        shell: bash
        env:
          VERTEX_GEMINI_HEAVY_MODEL: ${{ vars.VERTEX_GEMINI_HEAVY_MODEL }}
          AI_CHAT_PROVIDER_ORDER: ${{ vars.AI_CHAT_PROVIDER_ORDER }}
          ANTHROPIC_AI_ENABLED: ${{ vars.ANTHROPIC_AI_ENABLED }}
          ANTHROPIC_LIGHT_MODEL: ${{ vars.ANTHROPIC_LIGHT_MODEL }}
          ANTHROPIC_HEAVY_MODEL: ${{ vars.ANTHROPIC_HEAVY_MODEL }}
          ANTHROPIC_REASONING_MODEL: ${{ vars.ANTHROPIC_REASONING_MODEL }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
          VERCEL_ENV_TARGETS: ${{ vars.VERCEL_ENV_TARGETS }}
          AI_GATEWAY_VERCEL_OIDC_AUDIENCE: ${{ vars.AI_GATEWAY_VERCEL_OIDC_AUDIENCE }}
          AI_GATEWAY_VERCEL_OIDC_ISSUER_URL: ${{ vars.AI_GATEWAY_VERCEL_OIDC_ISSUER_URL }}
          AI_GATEWAY_VERCEL_OIDC_SUBJECTS: ${{ vars.AI_GATEWAY_VERCEL_OIDC_SUBJECTS }}
          GCP_AI_GATEWAY_URL: ${{ steps.deploy-gateway.outputs.gateway_url }}
          GCP_MEDIA_API_URL: ${{ steps.deploy-media-api.outputs.media_api_url }}
          REALTIME_GATEWAY_URL: ${{ steps.deploy-realtime-gateway.outputs.realtime_gateway_url }}
          WHATSAPP_FAST_WEBHOOK_PUBSUB_TOPIC: ${{ vars.WHATSAPP_FAST_WEBHOOK_PUBSUB_TOPIC || 'icecore-whatsapp-fast-events' }}
          CONVERSATION_CLASSIFICATION_PUBSUB_PROJECT_ID: ${{ vars.CONVERSATION_CLASSIFICATION_PUBSUB_PROJECT_ID || vars.GCP_PROJECT_ID }}
          CONVERSATION_CLASSIFICATION_PUBSUB_TOPIC: ${{ vars.CONVERSATION_CLASSIFICATION_PUBSUB_TOPIC || 'icecore-conversation-classification-events' }}
          CONVERSATION_CLASSIFICATION_RECONCILIATION_ENABLED: "true"
          WHATSAPP_OTP_DELIVERY_MODE: ${{ vars.WHATSAPP_OTP_DELIVERY_MODE || 'pubsub' }}
          WHATSAPP_OTP_TEMPORAL_WORKSPACE_ALLOWLIST: ${{ vars.WHATSAPP_OTP_TEMPORAL_WORKSPACE_ALLOWLIST }}
        run: |
          set -euo pipefail

          node .github/scripts/sync-vercel-runtime-env.mjs
          echo "::warning title=Vercel production redeploy required::Vercel environment changes do not affect the active deployment. Mandatory next step: redeploy Vercel production and verify the new deployment before considering this rollout complete."

      - name: Verify AI gateway public auth boundary
        shell: bash
        run: |
          set -euo pipefail

          gateway_url="${{ steps.deploy-gateway.outputs.gateway_url }}"
          payload='{"text":"health check"}'

          http_status="$(curl --silent --show-error --output /tmp/gateway-auth.json \
            --write-out "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data "${payload}" \
            "${gateway_url}/v1/embeddings/document")"

          response_body="$(cat /tmp/gateway-auth.json || true)"

          if [[ "${http_status}" == "401" ]] && grep -q '"error":"Missing bearer token"' /tmp/gateway-auth.json; then
            exit 0
          fi

          echo "Gateway auth boundary check failed with HTTP ${http_status}"
          echo "${response_body}"
          exit 1

      - name: Verify live Temporal history health after rollout
        shell: bash
        run: |
          set -euo pipefail

          MAX_ATTEMPTS="${TEMPORAL_POST_DEPLOY_REPLAY_ATTEMPTS:-6}"
          WAIT_SECONDS="${TEMPORAL_POST_DEPLOY_REPLAY_WAIT_SECONDS:-20}"

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            rm -rf .codex/temporal-replay-post-deploy

            pnpm --filter @icecore/temporal-worker export:replay-histories -- \
              --from-gcloud \
              --gcloud-project "${{ steps.deploy-meta.outputs.project_id }}" \
              --gcloud-region "${{ steps.deploy-meta.outputs.region }}" \
              --worker-pool "${{ steps.deploy-meta.outputs.worker_pool_name }}" \
              --limit 20 \
              --include-workflow-task-failures \
              --failure-scan-limit 100 \
              --failure-export-limit 10 \
              --out .codex/temporal-replay-post-deploy

            if pnpm --filter @icecore/temporal-worker replay:histories:strict -- \
              --fixtures-dir .codex/temporal-replay-post-deploy; then
              exit 0
            fi

            if [[ "${attempt}" -eq "${MAX_ATTEMPTS}" ]]; then
              echo "Temporal live replay/health check still failed after ${attempt} attempt(s)."
              exit 1
            fi

            sleep "${WAIT_SECONDS}"
          done

      - name: Retire standalone OTP worker pool
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID="${{ steps.deploy-meta.outputs.project_id }}"
          REGION="${{ steps.deploy-meta.outputs.region }}"
          WORKER_POOL_NAME="${{ steps.deploy-meta.outputs.worker_pool_name }}"
          OTP_WORKER_POOL_NAME="${{ steps.deploy-meta.outputs.otp_worker_pool_name }}"

          if [[ "${OTP_WORKER_POOL_NAME}" == "${WORKER_POOL_NAME}" ]]; then
            echo "The standalone OTP pool must be different from the main worker pool."
            exit 1
          fi

          worker_json="$(gcloud beta run worker-pools describe "${WORKER_POOL_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          otp_enabled="$(echo "${worker_json}" | jq -r \
            '[(.spec.template.spec.containers // .template.containers)[] | .env[]? | select(.name == "WHATSAPP_OTP_PUBSUB_ENABLED") | .value][0] // "false" | ascii_downcase | gsub("^\\s+|\\s+$"; "")')"
          case "${otp_enabled}" in
            true|1|yes|on) ;;
            *) echo "The main worker must consume OTP Pub/Sub before retiring the standalone pool."; exit 1 ;;
          esac

          existing_pool="$(gcloud beta run worker-pools list \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --filter="metadata.name=${OTP_WORKER_POOL_NAME}" --format='value(metadata.name)')"
          if [[ -z "${existing_pool}" ]]; then
            echo "No standalone OTP pool remains."
            exit 0
          fi

          otp_consumer_binding() {
            jq -c --arg project "${PROJECT_ID}" '
              [(.spec.template.spec.containers // .template.containers)[] | .env[]? |
                {key: .name, value: ((.value // "") | gsub("^\\s+|\\s+$"; ""))}] | from_entries |
              [(.WHATSAPP_OTP_PUBSUB_PROJECT_ID | select(. != null and . != "")) //
                (.GOOGLE_CLOUD_PROJECT | select(. != null and . != "")) //
                (.GCP_PROJECT_ID | select(. != null and . != "")) // $project,
               (.WHATSAPP_OTP_PUBSUB_SUBSCRIPTION | select(. != null and . != "")) //
                "icecore-whatsapp-otp-delivery-worker"]'
          }
          legacy_json="$(gcloud beta run worker-pools describe "${OTP_WORKER_POOL_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          if [[ "$(echo "${worker_json}" | otp_consumer_binding)" != "$(echo "${legacy_json}" | otp_consumer_binding)" ]]; then
            echo "The main worker must consume the legacy OTP subscription before retiring its pool."
            exit 1
          fi

          # Exact-build auxiliary startup and live Temporal history checks above
          # must succeed before the old consumer stops. Keep its revision for rollback.
          gcloud beta run worker-pools update "${OTP_WORKER_POOL_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" --instances=0

      - name: Summarize deployment
        run: |
          {
            echo "## Temporal worker deployed"
            echo ""
            echo "- Worker pool: \`${{ steps.deploy-meta.outputs.worker_pool_name }}\`"
            echo "- OTP delivery: consolidated into the main worker; standalone pool scaled to zero"
            echo "- Realtime dispatcher worker pool: \`${{ steps.deploy-meta.outputs.realtime_dispatcher_pool_name }}\`"
            if [[ "${GCP_OTP_API_ENABLED:-false}" == "true" ]]; then
              echo "- OTP API service: \`${{ steps.deploy-otp-api.outputs.service_name }}\`"
              echo "- OTP API URL: \`${{ steps.deploy-otp-api.outputs.otp_api_url }}\`"
            else
              echo "- OTP API service: skipped because \`GCP_OTP_API_ENABLED\` is not \`true\`"
            fi
            echo "- Image: \`${{ steps.deploy-meta.outputs.image_uri }}\`"
            echo "- Build ID: \`${{ steps.deploy-meta.outputs.build_id }}\`"
            echo "- Temporal deployment: \`${{ steps.deploy-meta.outputs.temporal_deployment_name }}\`"
            echo "- AI gateway service: \`${{ steps.deploy-gateway.outputs.service_name }}\`"
            echo "- AI gateway URL: \`${{ steps.deploy-gateway.outputs.gateway_url }}\`"
            echo "- Media API service: \`${{ steps.deploy-media-api.outputs.service_name }}\`"
            echo "- Media API URL: \`${{ steps.deploy-media-api.outputs.media_api_url }}\`"
            echo "- Realtime gateway service: \`${{ steps.deploy-realtime-gateway.outputs.service_name }}\`"
            echo "- Realtime gateway URL: \`${{ steps.deploy-realtime-gateway.outputs.realtime_gateway_url }}\`"
            echo "- Vercel env synced: \`GCP_AI_GATEWAY_URL=${{ steps.deploy-gateway.outputs.gateway_url }}\`"
            echo "- Vercel env synced: \`GCP_MEDIA_API_URL=${{ steps.deploy-media-api.outputs.media_api_url }}\`"
            echo "- Vercel env synced: \`REALTIME_GATEWAY_URL=${{ steps.deploy-realtime-gateway.outputs.realtime_gateway_url }}\`"
            echo "- Vercel env changes need a new production deployment. Deploy Web makes one after a push-triggered rollout; after a manual run, dispatch Deploy Web with the exact sha. If production already serves this commit, run \`redeploy_web\` instead."
            if [[ "${GCP_OTP_API_ENABLED:-false}" == "true" ]]; then
              echo "- Vercel env to set: \`GCP_OTP_API_URL=${{ steps.deploy-otp-api.outputs.otp_api_url }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report web deploy withheld
        if: ${{ github.event_name == 'push' && (failure() || cancelled()) }}
        shell: bash
        run: |
          {
            echo "## Web production not deployed"
            echo ""
            echo "- This worker rollout did not succeed, so Deploy Web will not deploy \`${GITHUB_SHA}\`; later commits that contain its worker changes wait for a successful rollout."
            echo "- Recovery: fix and re-run this workflow (web deploys after it succeeds), or dispatch Deploy Web with an exact \`sha\` once the worker is known good."
            echo "- See apps/temporal-worker/README.md#deploy-order-web-after-worker."
          } >> "$GITHUB_STEP_SUMMARY"
