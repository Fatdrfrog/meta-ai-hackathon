name: Deploy Temporal Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/temporal-worker/**"
      # Worker + AI gateway images bundle apps/web and load it at runtime (see apps/temporal-worker/Dockerfile).
      - "apps/web/src/lib/**"
      - "apps/web/src/models/**"
      - "apps/web/src/app/api/**"
      - "apps/web/src/types/**"
      - "apps/web/scripts/migrate-whatsapp-qr-entry-point-indexes.ts"
      - "apps/web/package.json"
      - "packages/**"
      - "cloudbuild.temporal-worker.yaml"
      - ".github/workflows/deploy-temporal-worker.yml"
      - ".github/cloud-run/runtime-manifest.json"
      - ".github/scripts/ensure-pubsub-resources.mjs"
      - ".github/scripts/ensure-service-account-project-roles.mjs"
      - ".github/scripts/ensure-worker-startup-probe.mjs"
      - ".github/scripts/prepare-cloud-run-runtime.mjs"
      - ".github/scripts/resolve-valkey-endpoint.mjs"
      - ".github/scripts/sync-gcp-llm-product-analytics.mjs"
      - ".github/scripts/creative-assets-bucket-config.mjs"
      - ".github/scripts/sync-vercel-runtime-env.mjs"
      - ".github/scripts/verify-gcloud-auth.mjs"
      - ".github/scripts/verify-supabase-campaign-contract.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      requests_rollout_action:
        description: "Deployment or protected Requests realtime action"
        required: true
        type: choice
        default: deploy_or_bootstrap
        options:
          - deploy_or_bootstrap
          - transition_sequence
          - capture_pre_b_baseline
          - redeploy_web
          - tenant_cost_preflight
          - tenant_cost_prepare
          - widget_preflight
      web_deployment_id:
        description: "Existing production Vercel deployment to rebuild (redeploy_web only)."
        required: false
        type: string
      web_expected_sha:
        description: "Full current main commit SHA of that deployment (redeploy_web only)."
        required: false
        type: string
      bootstrap_infra:
        description: "Allow this manual run to create missing GCP infra when the matching repo variable also enables creation."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-temporal-worker-prod
  cancel-in-progress: false

# Hybrid runner: keep GitHub Actions as orchestrator, move this fat workflow off hosted minutes.
# Repo variable DEPLOY_RUNS_ON (JSON array), e.g. ["self-hosted","linux","deploy"]
# Default stays ubuntu-latest until the variable is set (avoids queued jobs with no runner).
jobs:
  widget_preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.requests_rollout_action == 'widget_preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test read-only widget preflight
        run: node --test .github/scripts/widget-release-preflight.test.mjs .github/scripts/redeploy-vercel-production.test.mjs
      - name: Inspect widget release configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_WIDGET_PROJECT_ID: prj_TA7KG42qs2nABb34RMREHUdaKFq3
          VERCEL_TEAM_ID: team_WPHPkKZP5eLOhTmwJvwsywwJ
        run: node .github/scripts/widget-release-preflight.mjs
  tenant_cost_infrastructure:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.requests_rollout_action == 'tenant_cost_preflight' || inputs.requests_rollout_action == 'tenant_cost_prepare') }}
    uses: ./.github/workflows/tenant-cost-infrastructure.yml
    with:
      phase: ${{ inputs.requests_rollout_action == 'tenant_cost_prepare' && 'prepare' || 'preflight' }}
    secrets: inherit
  redeploy_web:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.requests_rollout_action == 'redeploy_web' }}
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
    # Serialized with Deploy Web (.github/workflows/deploy-web.yml) so two web
    # production deploys never race.
    concurrency:
      group: deploy-web-prod
      cancel-in-progress: false
    steps:
      - name: Check out recovery tooling
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test production deployment recovery
        run: node --test .github/scripts/redeploy-vercel-production.test.mjs .github/scripts/sync-vercel-runtime-env.test.mjs
      - name: Redeploy exact web production release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_REDEPLOY_ID: ${{ inputs.web_deployment_id }}
          VERCEL_REDEPLOY_EXPECTED_SHA: ${{ inputs.web_expected_sha }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
          AI_GATEWAY_VERCEL_OIDC_AUDIENCE: ${{ vars.AI_GATEWAY_VERCEL_OIDC_AUDIENCE }}
          AI_GATEWAY_VERCEL_OIDC_ISSUER_URL: ${{ vars.AI_GATEWAY_VERCEL_OIDC_ISSUER_URL }}
          AI_GATEWAY_VERCEL_OIDC_SUBJECTS: ${{ vars.AI_GATEWAY_VERCEL_OIDC_SUBJECTS }}
        run: node .github/scripts/redeploy-vercel-production.mjs
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name != 'workflow_dispatch' || inputs.requests_rollout_action == 'deploy_or_bootstrap' }}
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      GCP_PUBSUB_PUBLISHER_SERVICE_ACCOUNT: ${{ vars.GCP_PUBSUB_PUBLISHER_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      GCP_TRANSLATION_SERVICE_ACCOUNT: ${{ vars.GCP_TRANSLATION_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      GCP_TRANSLATION_SKIP_IAM_BINDING: ${{ vars.GCP_TRANSLATION_SKIP_IAM_BINDING }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_ENABLE_REQUIRED_APIS: ${{ vars.GCP_ENABLE_REQUIRED_APIS }}
      GCP_LLM_ANALYTICS_LOCATION: ${{ vars.GCP_LLM_ANALYTICS_LOCATION || 'US' }}
      CLOUD_RUN_SKIP_SECRET_SYNC: ${{ vars.CLOUD_RUN_SKIP_SECRET_SYNC }}
      GCP_WORKER_POOL_NAME: ${{ vars.GCP_WORKER_POOL_NAME }}
      GCP_WORKER_SERVICE_ACCOUNT: ${{ vars.GCP_WORKER_SERVICE_ACCOUNT }}
      GCP_WORKER_INSTANCES: ${{ vars.GCP_WORKER_INSTANCES }}
      GCP_WORKER_CPU: ${{ vars.GCP_WORKER_CPU }}
      GCP_WORKER_MEMORY: ${{ vars.GCP_WORKER_MEMORY }}
      GCP_WORKER_STARTUP_PROBE_ENABLED: ${{ vars.GCP_WORKER_STARTUP_PROBE_ENABLED || 'false' }}
      GCP_WORKER_STARTUP_PROBE_PORT: "8080"
      GCP_OTP_WORKER_POOL_NAME: ${{ vars.GCP_OTP_WORKER_POOL_NAME }}
      GCP_OTP_API_SERVICE_NAME: ${{ vars.GCP_OTP_API_SERVICE_NAME }}
      GCP_OTP_API_SERVICE_ACCOUNT: ${{ vars.GCP_OTP_API_SERVICE_ACCOUNT }}
      GCP_OTP_API_MIN_INSTANCES: ${{ vars.GCP_OTP_API_MIN_INSTANCES }}
      GCP_OTP_API_MAX_INSTANCES: ${{ vars.GCP_OTP_API_MAX_INSTANCES }}
      GCP_OTP_API_CPU: ${{ vars.GCP_OTP_API_CPU }}
      GCP_OTP_API_MEMORY: ${{ vars.GCP_OTP_API_MEMORY }}
      GCP_OTP_API_VPC_NETWORK: ${{ vars.GCP_OTP_API_VPC_NETWORK }}
      GCP_OTP_API_VPC_SUBNET: ${{ vars.GCP_OTP_API_VPC_SUBNET }}
      GCP_OTP_API_ENABLED: ${{ vars.GCP_OTP_API_ENABLED }}
      GCP_VALKEY_CREATE_IF_MISSING: ${{ vars.GCP_VALKEY_CREATE_IF_MISSING }}
      GCP_VALKEY_INSTANCE_NAME: ${{ vars.GCP_VALKEY_INSTANCE_NAME }}
      GCP_VALKEY_LOCATION: ${{ vars.GCP_VALKEY_LOCATION }}
      GCP_VALKEY_NETWORK: ${{ vars.GCP_VALKEY_NETWORK }}
      GCP_REALTIME_DISPATCHER_POOL_NAME: ${{ vars.GCP_REALTIME_DISPATCHER_POOL_NAME }}
      GCP_REALTIME_DISPATCHER_INSTANCES: ${{ vars.GCP_REALTIME_DISPATCHER_INSTANCES }}
      REALTIME_DISPATCHER_ENABLED: ${{ vars.REALTIME_DISPATCHER_ENABLED }}
      GCP_REALTIME_DISPATCHER_CPU: ${{ vars.GCP_REALTIME_DISPATCHER_CPU }}
      GCP_REALTIME_DISPATCHER_MEMORY: ${{ vars.GCP_REALTIME_DISPATCHER_MEMORY }}
      GCP_REALTIME_GATEWAY_SERVICE_NAME: ${{ vars.GCP_REALTIME_GATEWAY_SERVICE_NAME }}
      GCP_REALTIME_GATEWAY_MIN_INSTANCES: ${{ vars.GCP_REALTIME_GATEWAY_MIN_INSTANCES }}
      GCP_REALTIME_GATEWAY_MAX_INSTANCES: ${{ vars.GCP_REALTIME_GATEWAY_MAX_INSTANCES }}
      GCP_REALTIME_GATEWAY_CPU: ${{ vars.GCP_REALTIME_GATEWAY_CPU }}
      GCP_REALTIME_GATEWAY_MEMORY: ${{ vars.GCP_REALTIME_GATEWAY_MEMORY }}
      GCP_REALTIME_GATEWAY_CONCURRENCY: ${{ vars.GCP_REALTIME_GATEWAY_CONCURRENCY }}
      GCP_REALTIME_GATEWAY_TIMEOUT: ${{ vars.GCP_REALTIME_GATEWAY_TIMEOUT }}
      GCP_REALTIME_VPC_NETWORK: ${{ vars.GCP_REALTIME_VPC_NETWORK }}
      GCP_REALTIME_VPC_SUBNET: ${{ vars.GCP_REALTIME_VPC_SUBNET }}
      GCP_AI_GATEWAY_SERVICE_NAME: ${{ vars.GCP_AI_GATEWAY_SERVICE_NAME }}
      GCP_AI_GATEWAY_SERVICE_ACCOUNT: ${{ vars.GCP_AI_GATEWAY_SERVICE_ACCOUNT }}
      GCP_AI_GATEWAY_MIN_INSTANCES: ${{ vars.GCP_AI_GATEWAY_MIN_INSTANCES }}
      GCP_AI_GATEWAY_MAX_INSTANCES: ${{ vars.GCP_AI_GATEWAY_MAX_INSTANCES }}
      GCP_AI_GATEWAY_CPU: ${{ vars.GCP_AI_GATEWAY_CPU }}
      GCP_AI_GATEWAY_MEMORY: ${{ vars.GCP_AI_GATEWAY_MEMORY }}
      GCP_MEDIA_API_SERVICE_NAME: ${{ vars.GCP_MEDIA_API_SERVICE_NAME }}
      GCP_MEDIA_API_SERVICE_ACCOUNT: ${{ vars.GCP_MEDIA_API_SERVICE_ACCOUNT }}
      GCP_MEDIA_API_MIN_INSTANCES: ${{ vars.GCP_MEDIA_API_MIN_INSTANCES }}
      GCP_MEDIA_API_MAX_INSTANCES: ${{ vars.GCP_MEDIA_API_MAX_INSTANCES }}
      GCP_MEDIA_API_CPU: ${{ vars.GCP_MEDIA_API_CPU }}
      GCP_MEDIA_API_MEMORY: ${{ vars.GCP_MEDIA_API_MEMORY }}
      GCS_CREATIVE_ASSETS_BUCKET: ${{ vars.GCS_CREATIVE_ASSETS_BUCKET }}
      GCS_BULK_DISPATCH_BUCKET: ${{ vars.GCS_BULK_DISPATCH_BUCKET }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      TEMPORAL_CLOUD_ADDRESS: ${{ vars.TEMPORAL_CLOUD_ADDRESS }}
      TEMPORAL_CLOUD_NAMESPACE: ${{ vars.TEMPORAL_CLOUD_NAMESPACE }}
      TEMPORAL_WORKER_DEPLOYMENT_NAME: ${{ vars.TEMPORAL_WORKER_DEPLOYMENT_NAME }}
      TEMPORAL_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLOUD_API_KEY }}
      # Optional: tune waits if deploys are slow (bash defaults apply when unset/empty).
      TEMPORAL_BUILD_ID_WAIT_ATTEMPTS: ${{ vars.TEMPORAL_BUILD_ID_WAIT_ATTEMPTS }}
      TEMPORAL_BUILD_ID_WAIT_SECONDS: ${{ vars.TEMPORAL_BUILD_ID_WAIT_SECONDS }}
      TEMPORAL_WORKER_STARTUP_LOG_WAIT_ATTEMPTS: ${{ vars.TEMPORAL_WORKER_STARTUP_LOG_WAIT_ATTEMPTS }}
      TEMPORAL_WORKER_STARTUP_LOG_WAIT_SECONDS: ${{ vars.TEMPORAL_WORKER_STARTUP_LOG_WAIT_SECONDS }}
      TEMPORAL_SET_CURRENT_MAX_ATTEMPTS: ${{ vars.TEMPORAL_SET_CURRENT_MAX_ATTEMPTS }}
      TEMPORAL_SET_CURRENT_WAIT_SECONDS: ${{ vars.TEMPORAL_SET_CURRENT_WAIT_SECONDS }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate Temporal deployment contracts
        run: >
          node --test
          .github/scripts/temporal-deployment-contracts.test.mjs
          .github/scripts/redeploy-vercel-production.test.mjs
          .github/scripts/verify-supabase-campaign-contract.test.mjs
          .github/scripts/verify-gcloud-auth.test.mjs
          .github/scripts/ensure-pubsub-resources.test.mjs
          .github/scripts/sync-gcp-llm-product-analytics.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check worker types
        run: pnpm --filter @icecore/temporal-worker check-types

      - name: Install Temporal CLI
        shell: bash
        run: |
          set -euo pipefail

          TEMPORAL_INSTALL_DIR="$HOME/.temporalio"

          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/temporalio/cli/main/install.sh \
            --output /tmp/install-temporal.sh

          sh /tmp/install-temporal.sh --dir "$TEMPORAL_INSTALL_DIR"
          echo "$TEMPORAL_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Ensure worker audio tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Start local Valkey for worker tests
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f airi-ci-valkey >/dev/null 2>&1 || true
          # ECR Public first; its anonymous pull quota can run out for shared
          # runner IPs, so fall back to Google's Docker Hub mirror.
          started=false
          status=0
          for image in public.ecr.aws/docker/library/redis:7-alpine mirror.gcr.io/library/redis:7-alpine; do
            if docker run -d --name airi-ci-valkey -p 16379:6379 "$image"; then
              started=true
              break
            else
              status=$?
            fi
            echo "::warning::Could not start Valkey from $image (exit $status)." >&2
            docker rm -f airi-ci-valkey >/dev/null 2>&1 || true
          done
          if [[ "$started" != true ]]; then
            exit "$status"
          fi
          for i in $(seq 1 30); do
            if docker exec airi-ci-valkey redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Local Valkey is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Local Valkey did not become ready for Temporal worker tests." >&2
          exit 1

      - name: Test Temporal worker runtime
        env:
          REALTIME_VALKEY_URL: redis://127.0.0.1:16379
        run: pnpm --filter @icecore/temporal-worker test

      - name: Stop local Valkey for worker tests
        if: always()
        shell: bash
        run: docker rm -f airi-ci-valkey >/dev/null 2>&1 || true

      - name: Check worker startup imports
        env:
          NODE_ENV: production
          MONGODB_URI: mongodb://127.0.0.1:27017/airi_worker_import_smoke
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: import-smoke-anon
          SUPABASE_SERVICE_ROLE_KEY: import-smoke-service-role
        run: pnpm --filter @icecore/temporal-worker check:startup-import

      - name: Ensure Mongo indexes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: pnpm --filter @icecore/web run ensure:mongo-indexes

      - name: Apply WhatsApp QR index migration
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: pnpm --filter @icecore/web run migrate:whatsapp-qr-entry-point-indexes --apply

      - name: Verify Supabase campaign contract
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/verify-supabase-campaign-contract.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT || vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Verify gcloud authentication
        run: node .github/scripts/verify-gcloud-auth.mjs

      - name: Ensure Cloud Translation runtime IAM
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID="${GCP_PROJECT_ID:?Set repo variable GCP_PROJECT_ID}"
          TRANSLATION_SERVICE_ACCOUNT="${GCP_TRANSLATION_SERVICE_ACCOUNT:-${GCP_PUBSUB_PUBLISHER_SERVICE_ACCOUNT:-}}"
          if [[ -z "${TRANSLATION_SERVICE_ACCOUNT}" ]]; then
            candidate_service_account="vercel-wa-pubsub-publisher@${PROJECT_ID}.iam.gserviceaccount.com"
            if gcloud iam service-accounts describe "${candidate_service_account}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
              TRANSLATION_SERVICE_ACCOUNT="${candidate_service_account}"
            fi
          fi

          if [[ -z "${TRANSLATION_SERVICE_ACCOUNT}" ]]; then
            echo "No Cloud Translation runtime service account was configured or auto-detected; skipping IAM binding."
            exit 0
          fi

          iam_args=(
            --project "${PROJECT_ID}"
            --service-account "${TRANSLATION_SERVICE_ACCOUNT}"
            --role roles/cloudtranslate.user
          )

          if [[ "${GCP_TRANSLATION_SKIP_IAM_BINDING:-}" == "1" ]]; then
            iam_args+=(--skip-iam)
          fi

          node .github/scripts/ensure-service-account-project-roles.mjs "${iam_args[@]}"

      - name: Validate required worker secrets
        shell: bash
        env:
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "${ENCRYPTION_SECRET:-}" ]]; then
            {
              echo "Missing required GitHub secret: ENCRYPTION_SECRET."
              echo "Set it to the same value used by the web app, otherwise the Temporal worker cannot decrypt encrypted source credentials such as WhatsApp access tokens."
            } >&2
            exit 1
          fi

      - name: Enable required Google Cloud APIs
        if: ${{ vars.GCP_ENABLE_REQUIRED_APIS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID="${GCP_PROJECT_ID:?Set repo variable GCP_PROJECT_ID}"

          gcloud services enable \
            aiplatform.googleapis.com \
            artifactregistry.googleapis.com \
            bigquery.googleapis.com \
            cloudbuild.googleapis.com \
            iamcredentials.googleapis.com \
            memorystore.googleapis.com \
            networkconnectivity.googleapis.com \
            pubsub.googleapis.com \
            run.googleapis.com \
            secretmanager.googleapis.com \
            translate.googleapis.com \
            --project="${PROJECT_ID}"

      - name: Resolve deploy metadata
        id: deploy-meta
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID="${GCP_PROJECT_ID:?Set repo variable GCP_PROJECT_ID}"
          REGION="${GCP_REGION:-europe-west1}"
          ARTIFACT_REPOSITORY="${GCP_ARTIFACT_REPOSITORY:-icecore}"
          WORKER_POOL_NAME="${GCP_WORKER_POOL_NAME:-airi-temporal-worker-prod}"
          OTP_WORKER_POOL_NAME="${GCP_OTP_WORKER_POOL_NAME:-airi-otp-worker-prod}"
          OTP_API_SERVICE_NAME="${GCP_OTP_API_SERVICE_NAME:-airi-otp-api}"
          MEDIA_API_SERVICE_NAME="${GCP_MEDIA_API_SERVICE_NAME:-airi-media-api}"
          REALTIME_DISPATCHER_POOL_NAME="${GCP_REALTIME_DISPATCHER_POOL_NAME:-airi-realtime-dispatcher-prod}"
          REALTIME_GATEWAY_SERVICE_NAME="${GCP_REALTIME_GATEWAY_SERVICE_NAME:-airi-realtime-gateway}"
          TEMPORAL_DEPLOYMENT_NAME="${TEMPORAL_WORKER_DEPLOYMENT_NAME:-airi-temporal-worker}"
          TEMPORAL_DEPLOYMENT_NAME="${TEMPORAL_DEPLOYMENT_NAME#"${TEMPORAL_DEPLOYMENT_NAME%%[![:space:]]*}"}"
          TEMPORAL_DEPLOYMENT_NAME="${TEMPORAL_DEPLOYMENT_NAME%"${TEMPORAL_DEPLOYMENT_NAME##*[![:space:]]}"}"
          if [[ -z "${TEMPORAL_DEPLOYMENT_NAME}" ]]; then
            echo "TEMPORAL_WORKER_DEPLOYMENT_NAME must not be blank."
            exit 1
          fi
          BUILD_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/airi-temporal-worker:${BUILD_ID}"

          echo "project_id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"
          echo "region=${REGION}" >> "$GITHUB_OUTPUT"
          echo "worker_pool_name=${WORKER_POOL_NAME}" >> "$GITHUB_OUTPUT"
          echo "otp_worker_pool_name=${OTP_WORKER_POOL_NAME}" >> "$GITHUB_OUTPUT"
          echo "otp_api_service_name=${OTP_API_SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "media_api_service_name=${MEDIA_API_SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "realtime_dispatcher_pool_name=${REALTIME_DISPATCHER_POOL_NAME}" >> "$GITHUB_OUTPUT"
          echo "realtime_gateway_service_name=${REALTIME_GATEWAY_SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "temporal_deployment_name=${TEMPORAL_DEPLOYMENT_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Export live Temporal replay histories
        run: >
          pnpm --filter @icecore/temporal-worker export:replay-histories --
          --from-gcloud
          --gcloud-project "${{ steps.deploy-meta.outputs.project_id }}"
          --gcloud-region "${{ steps.deploy-meta.outputs.region }}"
          --worker-pool "${{ steps.deploy-meta.outputs.worker_pool_name }}"
          --limit 20
          --include-workflow-task-failures
          --failure-scan-limit 100
          --failure-export-limit 10
          --out .codex/temporal-replay-deploy

      - name: Replay live Temporal histories
        run: >
          pnpm --filter @icecore/temporal-worker replay:histories:strict --
          --fixtures-dir .codex/temporal-replay-deploy

      - name: Validate LLM product analytics
        shell: bash
        env:
          GCP_AI_GATEWAY_SERVICE_ACCOUNT: ${{ vars.GCP_AI_GATEWAY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          PROJECT_ID="${{ steps.deploy-meta.outputs.project_id }}"
          PUBLISHER_SERVICE_ACCOUNT="${GCP_AI_GATEWAY_SERVICE_ACCOUNT:-${GCP_WORKER_SERVICE_ACCOUNT:-}}"
          PUBLISHER_SERVICE_ACCOUNT="$(printf '%s' "${PUBLISHER_SERVICE_ACCOUNT}" | xargs)"
          if [[ -z "${PUBLISHER_SERVICE_ACCOUNT}" ]]; then
            echo "::error::Set GCP_AI_GATEWAY_SERVICE_ACCOUNT or GCP_WORKER_SERVICE_ACCOUNT for the deployed gateway identity." >&2
            exit 1
          fi

          node .github/scripts/sync-gcp-llm-product-analytics.mjs \
            --phase validate-finalized \
            --project "${PROJECT_ID}" \
            --publisher-service-account "${PUBLISHER_SERVICE_ACCOUNT}" \
            --publisher-service-account "${GCP_WORKER_SERVICE_ACCOUNT:-}"

      - name: Ensure WhatsApp Pub/Sub resources
        shell: bash
        env:
          WHATSAPP_WEBHOOK_PUBSUB_SKIP_SETUP: ${{ vars.WHATSAPP_WEBHOOK_PUBSUB_SKIP_SETUP }}
          WHATSAPP_WEBHOOK_PUBSUB_TOPIC: ${{ vars.WHATSAPP_WEBHOOK_PUBSUB_TOPIC }}
          WHATSAPP_WEBHOOK_PUBSUB_SUBSCRIPTION: ${{ vars.WHATSAPP_WEBHOOK_PUBSUB_SUBSCRIPTION }}
          WHATSAPP_WEBHOOK_PUBSUB_DLQ_TOPIC: ${{ vars.WHATSAPP_WEBHOOK_PUBSUB_DLQ_TOPIC }}
          WHATSAPP_WEBHOOK_PUBSUB_DLQ_SUBSCRIPTION: ${{ vars.WHATSAPP_WEBHOOK_PUBSUB_DLQ_SUBSCRIPTION }}
          WHATSAPP_WEBHOOK_PUBSUB_SKIP_IAM_BINDINGS: ${{ vars.WHATSAPP_WEBHOOK_PUBSUB_SKIP_IAM_BINDINGS }}
          WHATSAPP_FAST_WEBHOOK_PUBSUB_SKIP_SETUP: ${{ vars.WHATSAPP_FAST_WEBHOOK_PUBSUB_SKIP_SETUP }}
          WHATSAPP_FAST_WEBHOOK_PUBSUB_TOPIC: ${{ vars.WHATSAPP_FAST_WEBHOOK_PUBSUB_TOPIC }}
          WHATSAPP_FAST_WEBHOOK_PUBSUB_SUBSCRIPTION: ${{ vars.WHATSAPP_FAST_WEBHOOK_PUBSUB_SUBSCRIPTION }}
          WHATSAPP_FAST_WEBHOOK_PUBSUB_DLQ_TOPIC: ${{ vars.WHATSAPP_FAST_WEBHOOK_PUBSUB_DLQ_TOPIC }}
          WHATSAPP_FAST_WEBHOOK_PUBSUB_DLQ_SUBSCRIPTION: ${{ vars.WHATSAPP_FAST_WEBHOOK_PUBSUB_DLQ_SUBSCRIPTION }}
          WHATSAPP_FAST_WEBHOOK_PUBSUB_SKIP_IAM_BINDINGS: ${{ vars.WHATSAPP_FAST_WEBHOOK_PUBSUB_SKIP_IAM_BINDINGS }}
          WHATSAPP_FAST_LANE_PUBSUB_SKIP_SETUP: ${{ vars.WHATSAPP_FAST_LANE_PUBSUB_SKIP_SETUP }}
          WHATSAPP_FAST_LANE_PUBSUB_SUBSCRIPTION: ${{ vars.WHATSAPP_FAST_LANE_PUBSUB_SUBSCRIPTION }}
          WHATSAPP_CALL_PUBSUB_SKIP_SETUP: ${{ vars.WHATSAPP_CALL_PUBSUB_SKIP_SETUP }}
          WHATSAPP_CALL_PUBSUB_TOPIC: ${{ vars.WHATSAPP_CALL_PUBSUB_TOPIC }}
          WHATSAPP_CALL_PUBSUB_SUBSCRIPTION: ${{ vars.WHATSAPP_CALL_PUBSUB_SUBSCRIPTION }}
          WHATSAPP_CALL_PUBSUB_DLQ_TOPIC: ${{ vars.WHATSAPP_CALL_PUBSUB_DLQ_TOPIC }}
          WHATSAPP_CALL_PUBSUB_DLQ_SUBSCRIPTION: ${{ vars.WHATSAPP_CALL_PUBSUB_DLQ_SUBSCRIPTION }}
          WHATSAPP_CALL_PUBSUB_SKIP_IAM_BINDINGS: ${{ vars.WHATSAPP_CALL_PUBSUB_SKIP_IAM_BINDINGS }}
          WHATSAPP_OTP_PUBSUB_SKIP_SETUP: ${{ vars.WHATSAPP_OTP_PUBSUB_SKIP_SETUP }}
          WHATSAPP_OTP_PUBSUB_TOPIC: ${{ vars.WHATSAPP_OTP_PUBSUB_TOPIC }}
          WHATSAPP_OTP_PUBSUB_SUBSCRIPTION: ${{ vars.WHATSAPP_OTP_PUBSUB_SUBSCRIPTION }}
          WHATSAPP_OTP_PUBSUB_DLQ_TOPIC: ${{ vars.WHATSAPP_OTP_PUBSUB_DLQ_TOPIC }}
          WHATSAPP_OTP_PUBSUB_DLQ_SUBSCRIPTION: ${{ vars.WHATSAPP_OTP_PUBSUB_DLQ_SUBSCRIPTION }}
          WHATSAPP_OTP_PUBSUB_SKIP_IAM_BINDINGS: ${{ vars.WHATSAPP_OTP_PUBSUB_SKIP_IAM_BINDINGS }}
          WORKSPACE_USAGE_PUBSUB_SKIP_SETUP: ${{ vars.WORKSPACE_USAGE_PUBSUB_SKIP_SETUP }}
          WORKSPACE_USAGE_PUBSUB_TOPIC: ${{ vars.WORKSPACE_USAGE_PUBSUB_TOPIC }}
          WORKSPACE_USAGE_PUBSUB_SUBSCRIPTION: ${{ vars.WORKSPACE_USAGE_PUBSUB_SUBSCRIPTION }}
          WORKSPACE_USAGE_PUBSUB_DLQ_TOPIC: ${{ vars.WORKSPACE_USAGE_PUBSUB_DLQ_TOPIC }}
          WORKSPACE_USAGE_PUBSUB_DLQ_SUBSCRIPTION: ${{ vars.WORKSPACE_USAGE_PUBSUB_DLQ_SUBSCRIPTION }}
          WORKSPACE_USAGE_PUBSUB_SKIP_IAM_BINDINGS: ${{ vars.WORKSPACE_USAGE_PUBSUB_SKIP_IAM_BINDINGS }}
          CONVERSATION_CLASSIFICATION_PUBSUB_SKIP_SETUP: ${{ vars.CONVERSATION_CLASSIFICATION_PUBSUB_SKIP_SETUP }}
          CONVERSATION_CLASSIFICATION_PUBSUB_PROJECT_ID: ${{ vars.CONVERSATION_CLASSIFICATION_PUBSUB_PROJECT_ID || vars.GCP_PROJECT_ID }}
          CONVERSATION_CLASSIFICATION_PUBSUB_TOPIC: ${{ vars.CONVERSATION_CLASSIFICATION_PUBSUB_TOPIC }}
          CONVERSATION_CLASSIFICATION_PUBSUB_SUBSCRIPTION: ${{ vars.CONVERSATION_CLASSIFICATION_PUBSUB_SUBSCRIPTION }}
          CONVERSATION_CLASSIFICATION_PUBSUB_DLQ_TOPIC: ${{ vars.CONVERSATION_CLASSIFICATION_PUBSUB_DLQ_TOPIC }}
          CONVERSATION_CLASSIFICATION_PUBSUB_DLQ_SUBSCRIPTION: ${{ vars.CONVERSATION_CLASSIFICATION_PUBSUB_DLQ_SUBSCRIPTION }}
          CONVERSATION_CLASSIFICATION_PUBSUB_SKIP_IAM_BINDINGS: ${{ vars.CONVERSATION_CLASSIFICATION_PUBSUB_SKIP_IAM_BINDINGS }}
        run: |
          set -euo pipefail

          PROJECT_ID="${{ steps.deploy-meta.outputs.project_id }}"
          PUBSUB_PUBLISHER_SERVICE_ACCOUNT="${GCP_PUBSUB_PUBLISHER_SERVICE_ACCOUNT:-}"
          if [[ -z "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT}" ]]; then
            candidate_publisher_service_account="vercel-wa-pubsub-publisher@${PROJECT_ID}.iam.gserviceaccount.com"
            if gcloud iam service-accounts describe "${candidate_publisher_service_account}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
              PUBSUB_PUBLISHER_SERVICE_ACCOUNT="${candidate_publisher_service_account}"
            fi
          fi

          if [[ "${WHATSAPP_WEBHOOK_PUBSUB_SKIP_SETUP:-}" != "1" ]]; then
            webhook_pubsub_args=(
              --project "${PROJECT_ID}"
              --topic "${WHATSAPP_WEBHOOK_PUBSUB_TOPIC:-icecore-whatsapp-webhook-events}"
              --subscription "${WHATSAPP_WEBHOOK_PUBSUB_SUBSCRIPTION:-icecore-whatsapp-webhook-events-worker}"
              --dlq-topic "${WHATSAPP_WEBHOOK_PUBSUB_DLQ_TOPIC:-icecore-whatsapp-webhook-events-dlq}"
              --dlq-subscription "${WHATSAPP_WEBHOOK_PUBSUB_DLQ_SUBSCRIPTION:-icecore-whatsapp-webhook-events-dlq}"
              --disable-exactly-once-delivery
              --ack-deadline-seconds 20
            )
            if [[ "${WHATSAPP_WEBHOOK_PUBSUB_SKIP_IAM_BINDINGS:-}" == "1" ]]; then
              webhook_pubsub_args+=(--skip-dead-letter-iam --skip-subscriber-iam --skip-publisher-iam)
            fi
            if [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
              webhook_pubsub_args+=(--subscriber-service-account "${GCP_WORKER_SERVICE_ACCOUNT}")
            fi
            if [[ -n "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT:-}" ]]; then
              webhook_pubsub_args+=(--publisher-service-account "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT}")
            fi
            node .github/scripts/ensure-pubsub-resources.mjs "${webhook_pubsub_args[@]}"
          fi

          if [[ "${WHATSAPP_FAST_WEBHOOK_PUBSUB_SKIP_SETUP:-}" != "1" ]]; then
            fast_webhook_pubsub_args=(
              --project "${PROJECT_ID}"
              --topic "${WHATSAPP_FAST_WEBHOOK_PUBSUB_TOPIC:-icecore-whatsapp-fast-events}"
              --subscription "${WHATSAPP_FAST_WEBHOOK_PUBSUB_SUBSCRIPTION:-icecore-whatsapp-fast-events-worker}"
              --dlq-topic "${WHATSAPP_FAST_WEBHOOK_PUBSUB_DLQ_TOPIC:-icecore-whatsapp-fast-events-dlq}"
              --dlq-subscription "${WHATSAPP_FAST_WEBHOOK_PUBSUB_DLQ_SUBSCRIPTION:-icecore-whatsapp-fast-events-dlq}"
              --disable-exactly-once-delivery
              --ack-deadline-seconds 20
            )
            if [[ "${WHATSAPP_FAST_WEBHOOK_PUBSUB_SKIP_IAM_BINDINGS:-}" == "1" ]]; then
              fast_webhook_pubsub_args+=(--skip-dead-letter-iam --skip-subscriber-iam --skip-publisher-iam)
            fi
            if [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
              fast_webhook_pubsub_args+=(--subscriber-service-account "${GCP_WORKER_SERVICE_ACCOUNT}")
            fi
            if [[ -n "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT:-}" ]]; then
              fast_webhook_pubsub_args+=(--publisher-service-account "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT}")
            fi
            node .github/scripts/ensure-pubsub-resources.mjs "${fast_webhook_pubsub_args[@]}"
          fi

          # Unordered copy of the fast topic for the fast lane. It shares the
          # fast DLQ and keeps only 10 minutes of messages: the ordered
          # subscription stays the durable path, so stale copies are useless.
          if [[ "${WHATSAPP_FAST_LANE_PUBSUB_SKIP_SETUP:-}" != "1" ]]; then
            fast_lane_pubsub_args=(
              --project "${PROJECT_ID}"
              --topic "${WHATSAPP_FAST_WEBHOOK_PUBSUB_TOPIC:-icecore-whatsapp-fast-events}"
              --subscription "${WHATSAPP_FAST_LANE_PUBSUB_SUBSCRIPTION:-icecore-whatsapp-fast-events-unordered-worker}"
              --dlq-topic "${WHATSAPP_FAST_WEBHOOK_PUBSUB_DLQ_TOPIC:-icecore-whatsapp-fast-events-dlq}"
              --dlq-subscription "${WHATSAPP_FAST_WEBHOOK_PUBSUB_DLQ_SUBSCRIPTION:-icecore-whatsapp-fast-events-dlq}"
              --disable-message-ordering
              --disable-exactly-once-delivery
              --ack-deadline-seconds 20
              --message-retention-duration 10m
            )
            if [[ "${WHATSAPP_FAST_WEBHOOK_PUBSUB_SKIP_IAM_BINDINGS:-}" == "1" ]]; then
              fast_lane_pubsub_args+=(--skip-dead-letter-iam --skip-subscriber-iam --skip-publisher-iam)
            fi
            if [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
              fast_lane_pubsub_args+=(--subscriber-service-account "${GCP_WORKER_SERVICE_ACCOUNT}")
            fi
            if [[ -n "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT:-}" ]]; then
              fast_lane_pubsub_args+=(--publisher-service-account "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT}")
            fi
            node .github/scripts/ensure-pubsub-resources.mjs "${fast_lane_pubsub_args[@]}"
          fi

          if [[ "${WHATSAPP_CALL_PUBSUB_SKIP_SETUP:-}" != "1" ]]; then
            call_pubsub_args=(
              --project "${PROJECT_ID}"
              --topic "${WHATSAPP_CALL_PUBSUB_TOPIC:-icecore-whatsapp-call-events}"
              --subscription "${WHATSAPP_CALL_PUBSUB_SUBSCRIPTION:-icecore-whatsapp-call-events-worker}"
              --dlq-topic "${WHATSAPP_CALL_PUBSUB_DLQ_TOPIC:-icecore-whatsapp-call-events-dlq}"
              --dlq-subscription "${WHATSAPP_CALL_PUBSUB_DLQ_SUBSCRIPTION:-icecore-whatsapp-call-events-dlq}"
            )
            if [[ "${WHATSAPP_CALL_PUBSUB_SKIP_IAM_BINDINGS:-}" == "1" ]]; then
              call_pubsub_args+=(--skip-dead-letter-iam --skip-subscriber-iam --skip-publisher-iam)
            fi
            if [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
              call_pubsub_args+=(--subscriber-service-account "${GCP_WORKER_SERVICE_ACCOUNT}")
            fi
            if [[ -n "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT:-}" ]]; then
              call_pubsub_args+=(--publisher-service-account "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT}")
            fi
            node .github/scripts/ensure-pubsub-resources.mjs "${call_pubsub_args[@]}"
          fi

          if [[ "${WHATSAPP_OTP_PUBSUB_SKIP_SETUP:-}" != "1" ]]; then
            otp_pubsub_args=(
              --project "${PROJECT_ID}"
              --topic "${WHATSAPP_OTP_PUBSUB_TOPIC:-icecore-whatsapp-otp-delivery}"
              --subscription "${WHATSAPP_OTP_PUBSUB_SUBSCRIPTION:-icecore-whatsapp-otp-delivery-worker}"
              --dlq-topic "${WHATSAPP_OTP_PUBSUB_DLQ_TOPIC:-icecore-whatsapp-otp-delivery-dlq}"
              --dlq-subscription "${WHATSAPP_OTP_PUBSUB_DLQ_SUBSCRIPTION:-icecore-whatsapp-otp-delivery-dlq}"
            )
            if [[ "${WHATSAPP_OTP_PUBSUB_SKIP_IAM_BINDINGS:-}" == "1" ]]; then
              otp_pubsub_args+=(--skip-dead-letter-iam --skip-subscriber-iam --skip-publisher-iam)
            fi
            OTP_WORKER_SUBSCRIBER_SERVICE_ACCOUNT="${GCP_WORKER_SERVICE_ACCOUNT:-}"
            if [[ -n "${OTP_WORKER_SUBSCRIBER_SERVICE_ACCOUNT}" ]]; then
              otp_pubsub_args+=(--subscriber-service-account "${OTP_WORKER_SUBSCRIBER_SERVICE_ACCOUNT}")
            fi
            if [[ -n "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT:-}" ]]; then
              otp_pubsub_args+=(--publisher-service-account "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT}")
            fi
            node .github/scripts/ensure-pubsub-resources.mjs "${otp_pubsub_args[@]}"
          fi

          if [[ "${WORKSPACE_USAGE_PUBSUB_SKIP_SETUP:-}" != "1" ]]; then
            usage_pubsub_args=(
              --project "${PROJECT_ID}"
              --topic "${WORKSPACE_USAGE_PUBSUB_TOPIC:-icecore-workspace-usage-events}"
              --subscription "${WORKSPACE_USAGE_PUBSUB_SUBSCRIPTION:-icecore-workspace-usage-events-worker}"
              --dlq-topic "${WORKSPACE_USAGE_PUBSUB_DLQ_TOPIC:-icecore-workspace-usage-events-dlq}"
              --dlq-subscription "${WORKSPACE_USAGE_PUBSUB_DLQ_SUBSCRIPTION:-icecore-workspace-usage-events-dlq-worker}"
            )
            if [[ "${WORKSPACE_USAGE_PUBSUB_SKIP_IAM_BINDINGS:-}" == "1" ]]; then
              usage_pubsub_args+=(--skip-dead-letter-iam --skip-subscriber-iam --skip-publisher-iam)
            fi
            if [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
              usage_pubsub_args+=(--subscriber-service-account "${GCP_WORKER_SERVICE_ACCOUNT}")
            fi
            if [[ -n "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT:-}" ]]; then
              usage_pubsub_args+=(--publisher-service-account "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT}")
            fi
            node .github/scripts/ensure-pubsub-resources.mjs "${usage_pubsub_args[@]}"
          fi

          realtime_pubsub_args=(
            --project "${PROJECT_ID}"
            --topic "icecore-realtime-events"
            --subscription "icecore-realtime-events-dispatcher"
            --dlq-topic "icecore-realtime-events-dlq"
            --dlq-subscription "icecore-realtime-events-dlq"
            --disable-exactly-once-delivery
            --ack-deadline-seconds 20
          )
          if [[ -n "${GCP_WORKER_SERVICE_ACCOUNT:-}" ]]; then
            realtime_pubsub_args+=(--subscriber-service-account "${GCP_WORKER_SERVICE_ACCOUNT}")
          fi
          if [[ -n "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT:-}" ]]; then
            realtime_pubsub_args+=(--publisher-service-account "${PUBSUB_PUBLISHER_SERVICE_ACCOUNT}")
          fi
          node .github/scripts/ensure-pubsub-resources.mjs "${realtime_pubsub_args[@]}"

          classification_pubsub_args=(
            --project "${CONVERSATION_CLASSIFICATION_PUBSUB_PROJECT_ID:-${PROJECT_ID}}"
            --topic "${CONVERSATION_CLASSIFICATION_PUBSUB_TOPIC:-icecore-conversation-classification-events}"
            --subscription "${CONVERSATION_CLASSIFICATION_PUBSUB_SUBSCRIPTION:-icecore-conversation-classification-events-worker}"
            --dlq-topic "${CONVERSATION_CLASSIFICATION_PUBSUB_DLQ_TOPIC:-icecore-conversation-classification-events-dlq}"
            --dlq-subscription "${CONVERSATION_CLASSIFICATION_PUBSUB_DLQ_SUBSCRIPTION:-icecore-conversation-classification-events-dlq-worker}"
            --message-retention-duration "31d"
            --never-expire
          )
          if [[ "${CONVERSATION_CLASSIFICATION_PUBSUB_SKIP_SETUP:-}" == "1" ]]; then
            classification_pubsub_args+=(--skip-setup)
          fi
          if [[ "${CONVERSATION_CLASSIFICATION_PUBSUB_SKIP_IAM_BINDINGS:-}" == "1" ]]; then
            classification_pubsub_args+=(--skip-dead-letter-iam --skip-subscriber-iam --skip-publisher-iam)
          fi

          GCP_SERVICE_ACCOUNT_EMAIL="$(printf '%s' "${GCP_SERVICE_ACCOUNT_EMAIL:-}" | xargs)"
          if [[ -z "${GCP_SERVICE_ACCOUNT_EMAIL}" ]]; then
            echo "::error::Set repo variable GCP_SERVICE_ACCOUNT_EMAIL to a nonblank service account email." >&2
            exit 1
          fi
          GCP_WORKER_SERVICE_ACCOUNT="$(printf '%s' "${GCP_WORKER_SERVICE_ACCOUNT:-}" | xargs)"
          if [[ -z "${GCP_WORKER_SERVICE_ACCOUNT}" ]]; then
            echo "::error::Set repo variable GCP_WORKER_SERVICE_ACCOUNT to a nonblank service account email." >&2
            exit 1
          fi
          classification_pubsub_args+=(
            --subscriber-service-account "${GCP_WORKER_SERVICE_ACCOUNT}"
            --publisher-service-account "${GCP_SERVICE_ACCOUNT_EMAIL}"
            --publisher-service-account "${GCP_WORKER_SERVICE_ACCOUNT}"
          )
          node .github/scripts/ensure-pubsub-resources.mjs "${classification_pubsub_args[@]}"

      - name: Resolve Memorystore Valkey endpoint
        id: valkey
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID="${{ steps.deploy-meta.outputs.project_id }}"
          REGION="${{ steps.deploy-meta.outputs.region }}"
          LOCATION="${GCP_VALKEY_LOCATION:-${REGION}}"
          INSTANCE="${GCP_VALKEY_INSTANCE_NAME:-airi-realtime-valkey}"
          NETWORK="${GCP_VALKEY_NETWORK:-${GCP_REALTIME_VPC_NETWORK:-${GCP_OTP_API_VPC_NETWORK:-default}}}"
          REQUESTED_CREATE_IF_MISSING="${GCP_VALKEY_CREATE_IF_MISSING:-false}"
          REQUESTED_CREATE_IF_MISSING_NORMALIZED="$(echo "${REQUESTED_CREATE_IF_MISSING}" | tr '[:upper:]' '[:lower:]')"
          BOOTSTRAP_INFRA="${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_infra == true && 'true' || 'false' }}"
          CREATE_IF_MISSING="false"

          if [[ "${BOOTSTRAP_INFRA}" == "true" ]]; then
            CREATE_IF_MISSING="${REQUESTED_CREATE_IF_MISSING}"
          elif [[ "${REQUESTED_CREATE_IF_MISSING_NORMALIZED}" =~ ^(1|true|yes)$ ]]; then
            echo "::warning::Ignoring GCP_VALKEY_CREATE_IF_MISSING=${REQUESTED_CREATE_IF_MISSING} because this is not a manual bootstrap_infra run. Normal deploys resolve existing Valkey only."
          fi

          node .github/scripts/resolve-valkey-endpoint.mjs \
            --project "${PROJECT_ID}" \
            --location "${LOCATION}" \
            --instance "${INSTANCE}" \
            --network "${NETWORK}" \
            --create-if-missing "${CREATE_IF_MISSING}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Prepare Cloud Run runtime config
        id: runtime-config
        shell: bash
        env:
          CLOUD_RUN_SKIP_SECRET_SYNC: ${{ vars.CLOUD_RUN_SKIP_SECRET_SYNC }}
          AIRI_AUTO_REPLY: ${{ vars.AIRI_AUTO_REPLY }}
          AIRI_AUTO_REPLY_MODE: ${{ vars.AIRI_AUTO_REPLY_MODE }}
          AIRI_CAMPAIGN_EMAIL_BATCH_ENABLED: ${{ vars.AIRI_CAMPAIGN_EMAIL_BATCH_ENABLED || 'true' }}
          AIRI_FAST_RAG: ${{ vars.AIRI_FAST_RAG }}
          AIRI_FAST_RAG_TELEGRAM: ${{ vars.AIRI_FAST_RAG_TELEGRAM }}
          AI_GATEWAY_VERCEL_OIDC_AUDIENCE: ${{ vars.AI_GATEWAY_VERCEL_OIDC_AUDIENCE }}
          AI_GATEWAY_VERCEL_OIDC_ISSUER_URL: ${{ vars.AI_GATEWAY_VERCEL_OIDC_ISSUER_URL }}
          AI_GATEWAY_VERCEL_OIDC_SUBJECTS: ${{ vars.AI_GATEWAY_VERCEL_OIDC_SUBJECTS }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_STT_ENABLED: ${{ vars.ELEVENLABS_STT_ENABLED }}
          ELEVENLABS_STT_MODEL: ${{ vars.ELEVENLABS_STT_MODEL }}
          ELEVENLABS_STT_WEBHOOK_ID: ${{ vars.ELEVENLABS_STT_WEBHOOK_ID }}
          ELEVENLABS_STT_WEBHOOK_SECRET: ${{ secrets.ELEVENLABS_STT_WEBHOOK_SECRET }}
          ELEVENLABS_TIMEOUT_MS: ${{ vars.ELEVENLABS_TIMEOUT_MS }}
          EMBEDDING_BATCH_CONCURRENCY: ${{ vars.EMBEDDING_BATCH_CONCURRENCY }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
          OTP_HASH_SECRET: ${{ secrets.OTP_HASH_SECRET }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT || vars.GCP_PROJECT_ID }}
          GCP_LLM_ANALYTICS_MAX_BYTES_BILLED: ${{ vars.GCP_LLM_ANALYTICS_MAX_BYTES_BILLED }}
          REALTIME_DISPATCHER_ENABLED: ${{ vars.REALTIME_DISPATCHER_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_VIDEO_GENERATION_MODEL: ${{ vars.GOOGLE_VIDEO_GENERATION_MODEL }}
          GOOGLE_GENERATIVE_MEDIA_HOST_ALLOWLIST: ${{ vars.GOOGLE_GENERATIVE_MEDIA_HOST_ALLOWLIST }}
          GCS_CREATIVE_ASSETS_BUCKET: ${{ vars.GCS_CREATIVE_ASSETS_BUCKET }}
          STORAGE_QUOTA_ROLLOUT_MODE: ${{ vars.STORAGE_QUOTA_ROLLOUT_MODE }}
          GCS_BULK_DISPATCH_BUCKET: ${{ vars.GCS_BULK_DISPATCH_BUCKET || vars.GCS_CREATIVE_ASSETS_BUCKET }}
          LLM_WHATSAPP_FEEDBACK_PROMPT_ENABLED: ${{ vars.LLM_WHATSAPP_FEEDBACK_PROMPT_ENABLED }}
          LLM_WHATSAPP_FEEDBACK_TESTERS: ${{ vars.LLM_WHATSAPP_FEEDBACK_TESTERS }}
          BRIA_API_TOKEN: ${{ secrets.BRIA_API_TOKEN }}
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
          ALIBABA_API_HOST: ${{ vars.ALIBABA_API_HOST }}
          WAN_S2V_MODEL: ${{ vars.WAN_S2V_MODEL }}
          WAN_I2V_MODEL: ${{ vars.WAN_I2V_MODEL }}
          WAN_S2V_DEFAULT_RESOLUTION: ${{ vars.WAN_S2V_DEFAULT_RESOLUTION }}
          HAPPYHORSE_T2V_MODEL: ${{ vars.HAPPYHORSE_T2V_MODEL }}
          HAPPYHORSE_I2V_MODEL: ${{ vars.HAPPYHORSE_I2V_MODEL }}
          HAPPYHORSE_R2V_MODEL: ${{ vars.HAPPYHORSE_R2V_MODEL }}
          HAPPYHORSE_DEFAULT_RESOLUTION: ${{ vars.HAPPYHORSE_DEFAULT_RESOLUTION }}
          HAPPYHORSE_DEFAULT_RATIO: ${{ vars.HAPPYHORSE_DEFAULT_RATIO }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          HIGGSFIELD_API_SECRET: ${{ secrets.HIGGSFIELD_API_SECRET }}
          HIGGSFIELD_IMAGE_MODEL: ${{ vars.HIGGSFIELD_IMAGE_MODEL }}
          HIGGSFIELD_IMAGE_TO_VIDEO_MODEL: ${{ vars.HIGGSFIELD_IMAGE_TO_VIDEO_MODEL }}
          HIGGSFIELD_KEY: ${{ secrets.HIGGSFIELD_KEY }}
          HIGGSFIELD_MEDIA_HOST_ALLOWLIST: ${{ vars.HIGGSFIELD_MEDIA_HOST_ALLOWLIST }}
          HIGGSFIELD_MEDIA_DOWNLOAD_TIMEOUT_MS: ${{ vars.HIGGSFIELD_MEDIA_DOWNLOAD_TIMEOUT_MS }}
          HIGGSFIELD_WEBHOOK_SECRET: ${{ secrets.HIGGSFIELD_WEBHOOK_SECRET }}
